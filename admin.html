<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — OrderPadi</title>
  <style>
    :root { --bg:#f6f6f3; --card:#ffffff; --ink:#141414; --muted:#6b6b66; --line:#e4e4de; --accent:#0a7d4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101010; --card:#1a1a1a; --ink:#f2f2ef; --muted:#a3a39d; --line:#2a2a28; --accent:#2fbf7f; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    main { max-width:480px; margin:0 auto; padding:40px 16px; }
    .logo { font-weight:700; font-size:20px; letter-spacing:-0.02em; }
    .logo span { color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:24px; }
    h1 { font-size:24px; margin:0 0 8px; }
    p { color:var(--muted); margin:0; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Order<span>Padi</span></div>
    <div class="card">
      <h1>Admin</h1>
      <p>Placeholder. Vendor management, plans and suspensions come in step 8.</p>
    </div>
  </main>
</body>
</html>
