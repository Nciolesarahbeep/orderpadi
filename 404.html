    @media (prefers-color-scheme: dark) { :root { --bg:#0f1110; --ink:#f2f2ef; --muted:#a7a7a1; --line:#2b2d2c; --green:#2fbf7f; --green-ink:#0b1f15; --serial:#ff5a6e; } }

    h1 { font-size:clamp(32px, 8vw, 42px); line-height:1.08; letter-spacing:-0.035em; margin:0 0 14px; }
    p { color:var(--muted); margin:0 0 28px; }
    .btn { display:inline-block; padding:15px 24px; border-radius:14px; background:var(--green); color:var(--green-ink); font-weight:700; text-decoration:none; }
    :focus-visible { outline:3px solid var(--green); outline-offset:3px; border-radius:6px; }
  </style>
</head>

</html>
