<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Invoice</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!--meta-->
  <style>
    :root {
      --bg:#f6f6f3; --card:#ffffff; --ink:#141414; --muted:#6b6b66; --line:#e4e4de;
      --accent:#0a7d4f; --accent-ink:#ffffff; --accent-soft:#e7f4ee; --bad:#b42318; --bad-soft:#fdecea;
      --warn:#8a5a00; --warn-soft:#fff3d6; --wa:#1fa855;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#101010; --card:#1a1a1a; --ink:#f2f2ef; --muted:#a3a39d; --line:#2a2a28;
        --accent:#2fbf7f; --accent-ink:#0b1f15; --accent-soft:#14291f; --bad:#ff7a6b; --bad-soft:#2c1714;
        --warn:#f2c14e; --warn-soft:#2e2510; --wa:#2fbf6a;
      }
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; }
    main { max-width:480px; margin:0 auto; padding:24px 16px calc(40px + env(safe-area-inset-bottom)); }
    .view { display:none; }
    .view.active { display:block; }
    .loading { padding:80px 0; text-align:center; color:var(--muted); }
    .muted { color:var(--muted); }

    .paper { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 20px; position:relative; overflow:hidden; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .store { font-size:20px; font-weight:700; letter-spacing:-0.02em; margin:0; }
    .doc { font-size:14px; color:var(--muted); margin:2px 0 0; }
    .pill { flex:none; font-size:13px; font-weight:700; padding:4px 12px; border-radius:999px; }
    .pill.unpaid, .pill.part_paid { background:var(--warn-soft); color:var(--warn); }
    .pill.paid { background:var(--accent-soft); color:var(--accent); }
    .pill.cancelled { background:var(--line); color:var(--muted); }
    .meta { display:flex; gap:16px; margin:18px 0 6px; font-size:14px; }
    .meta div { flex:1; min-width:0; }
    .meta .label { font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
    .meta p { margin:2px 0 0; overflow-wrap:anywhere; }
    .lines { margin-top:16px; border-top:1px solid var(--line); }
    .kv { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
    .kv.sub { border-bottom:0; padding:5px 0; color:var(--muted); }
    .kv.total { border-bottom:0; padding-top:12px; font-weight:700; font-size:18px; }
    .kv.due { border-bottom:0; font-weight:700; color:var(--warn); }
    .stamp { position:absolute; top:58px; right:-34px; transform:rotate(28deg); background:var(--accent); color:var(--accent-ink); font-weight:800; letter-spacing:0.2em; padding:4px 44px; font-size:13px; }
    .notice { margin-top:16px; padding:12px 14px; border-radius:12px; font-size:14px; }
    .notice.ok { background:var(--accent-soft); color:var(--accent); font-weight:600; }
    .notice.off { background:var(--line); color:var(--muted); }
    .notice.wait { background:var(--warn-soft); color:var(--warn); font-weight:600; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
    .card-label { font-size:13px; color:var(--muted); margin:0; }
    .amount { font-size:28px; font-weight:700; letter-spacing:-0.02em; margin:2px 0 10px; font-variant-numeric:tabular-nums; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
    .row b { font-variant-numeric:tabular-nums; }
    .copy { border:1px solid var(--line); background:none; color:var(--accent); font:inherit; font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; cursor:pointer; margin-left:8px; }
    .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:15px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:16px; font-weight:600; text-decoration:none; cursor:pointer; }
    .btn[disabled] { opacity:0.6; }
    .btn.secondary { background:var(--card); color:var(--ink); border:1px solid var(--line); }
    .btn.wa { background:var(--wa); color:#fff; }
    .error { margin:12px 0 0; padding:12px 14px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:14px; }
    footer { margin-top:32px; text-align:center; font-size:13px; color:var(--muted); }
    footer a { color:var(--ink); font-weight:700; text-decoration:none; }
    footer a span { color:var(--accent); }

    @media print {
      :root { --bg:#fff; --card:#fff; --ink:#000; --muted:#555; --line:#ddd; }
      body { background:#fff; }
      main { padding:0; max-width:none; }
      .no-print { display:none !important; }
      .paper { border:0; padding:0; }
    }
  </style>
</head>
<body>
  <main>
    <section class="view active" id="view-loading"><p class="loading">Loading invoice…</p></section>

    <section class="view" id="view-missing">
      <div style="text-align:center;margin-top:60px">
        <h1 id="missing-title" style="margin:0">Invoice not found</h1>
        <p class="muted" id="missing-text">Check the link with the seller.</p>
      </div>
    </section>

    <section class="view" id="view-invoice">
      <div class="paper">
        <div class="stamp" id="stamp" hidden>PAID</div>
        <div class="head">
          <div>
            <p class="store" id="inv-store"></p>
            <p class="doc" id="inv-doc"></p>
          </div>
          <span class="pill" id="inv-pill"></span>
        </div>
        <div class="meta">
          <div><span class="label">Date</span><p id="inv-date"></p></div>
          <div><span class="label">Billed to</span><p id="inv-customer"></p><p class="muted" id="inv-address"></p></div>
        </div>
        <div class="lines" id="inv-lines"></div>
        <div id="inv-totals"></div>
        <p class="notice" id="inv-notice" hidden></p>
      </div>

      <div class="card no-print" id="pay-card" hidden>
        <p class="card-label">Amount to pay</p>
        <div class="amount" id="pay-amount"></div>
        <div id="pay-bank"></div>
        <button class="btn" type="button" id="paid-btn">I've paid</button>
        <p class="error" id="paid-error" hidden></p>
      </div>

      <div class="no-print">
        <a class="btn wa" id="chat-btn" target="_blank" rel="noopener" hidden>Message the seller on WhatsApp</a>
        <button class="btn secondary" type="button" id="print-btn">Save as PDF or print</button>
      </div>
    </section>

    <footer id="branding" hidden>Made with <a href="/">Order<span>Padi</span></a></footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const publicId = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
    const state = { invoice: null, store: null };

    function formatNaira(kobo) {
      const decimals = kobo % 100 === 0 ? 0 : 2;
      return '₦' + (kobo / 100).toLocaleString('en-NG', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function kv(label, value, className) {
      const row = el('div', 'kv' + (className ? ' ' + className : ''));
      row.append(el('span', null, label), el('span', null, value));
      return row;
    }
    function fullDate(iso) {
      return new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function switchView(name) {
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
    }
    async function api(path, body) {
      try {
        const res = await fetch(path, body
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
          : { cache: 'no-store' });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        return { ok: false, status: 0, data: { error: "Can't connect. Check your internet and try again." } };
      }
    }

    const PILL = { unpaid: 'Unpaid', part_paid: 'Part paid', paid: 'Paid', cancelled: 'Cancelled' };

    function render() {
      const inv = state.invoice;
      const store = state.store;
      const cancelled = inv.status === 'cancelled';
      const paid = !cancelled && inv.paymentStatus === 'paid';
      const docName = paid ? 'Receipt' : 'Invoice';
      document.title = docName + ' #' + inv.number + ' · ' + store.businessName;

      $('inv-store').textContent = store.businessName;
      $('inv-doc').textContent = docName + ' #' + inv.number;
      const pillKind = cancelled ? 'cancelled' : inv.paymentStatus;
      $('inv-pill').className = 'pill ' + pillKind;
      $('inv-pill').textContent = PILL[pillKind];
      $('inv-pill').hidden = paid; // the PAID stamp says it instead
      $('stamp').hidden = !paid;
      $('inv-date').textContent = fullDate(inv.createdAt);
      $('inv-customer').textContent = inv.customerName;
      $('inv-address').textContent = inv.deliveryAddress;

      const lines = $('inv-lines');
      lines.textContent = '';
      inv.items.forEach((i) => lines.appendChild(kv(i.quantity + ' × ' + i.name, formatNaira(i.lineTotalKobo))));

      const totals = $('inv-totals');
      totals.textContent = '';
      totals.appendChild(kv('Subtotal', formatNaira(inv.subtotalKobo), 'sub'));
      if (inv.deliveryFeeKobo) totals.appendChild(kv('Delivery', formatNaira(inv.deliveryFeeKobo), 'sub'));
      if (inv.discountKobo) totals.appendChild(kv('Discount', '−' + formatNaira(inv.discountKobo), 'sub'));
      totals.appendChild(kv('Total', formatNaira(inv.totalKobo), 'total'));
      if (inv.amountPaidKobo && !cancelled) {
        totals.appendChild(kv('Paid', formatNaira(inv.amountPaidKobo), 'sub'));
        if (inv.balanceKobo) totals.appendChild(kv('Still to pay', formatNaira(inv.balanceKobo), 'due'));
      }

      const notice = $('inv-notice');
      notice.hidden = true;
      if (cancelled) {
        notice.className = 'notice off';
        notice.textContent = 'This order was cancelled. Contact ' + store.businessName + ' if you have questions.';
        notice.hidden = false;
      } else if (paid) {
        const last = inv.payments[inv.payments.length - 1];
        notice.className = 'notice ok';
        notice.textContent = 'Paid in full' + (last ? ' · ' + fullDate(last.paidAt) : '') + '. Thank you!';
        notice.hidden = false;
      } else if (inv.customerMarkedPaidAt) {
        notice.className = 'notice wait';
        notice.textContent = 'You told ' + store.businessName + ' you paid on ' + fullDate(inv.customerMarkedPaidAt) + '. They\'ll confirm it soon.';
        notice.hidden = false;
      }

      // How to pay (only while money is owed)
      const owed = !cancelled && inv.balanceKobo > 0;
      $('pay-card').hidden = !owed;
      if (owed) {
        $('pay-amount').textContent = formatNaira(inv.balanceKobo);
        const bank = $('pay-bank');
        bank.textContent = '';
        if (store.bank) {
          [['Bank', store.bank.name], ['Account number', store.bank.accountNumber], ['Account name', store.bank.accountName]].forEach(([label, value]) => {
            const row = el('div', 'row');
            row.appendChild(el('span', 'muted', label));
            const right = el('span');
            right.appendChild(el('b', null, value));
            if (label === 'Account number') {
              const copy = el('button', 'copy', 'Copy');
              copy.type = 'button';
              copy.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; }
                catch (e) { copy.textContent = 'Hold to copy'; }
                setTimeout(() => { copy.textContent = 'Copy'; }, 2000);
              });
              right.appendChild(copy);
            }
            row.appendChild(right);
            bank.appendChild(row);
          });
        } else {
          bank.appendChild(el('p', 'muted', store.businessName + ' will send you their payment details.'));
        }
        $('paid-btn').hidden = !!inv.customerMarkedPaidAt;
      }

      if (store.whatsappPhone) {
        const text = 'Hi ' + store.businessName + ', about my order #' + inv.number + ': ' + location.href;
        $('chat-btn').href = 'https://wa.me/' + store.whatsappPhone + '?text=' + encodeURIComponent(text);
        $('chat-btn').hidden = false;
      }
      $('branding').hidden = !store.branded;
      switchView('invoice');
    }

    $('paid-btn').addEventListener('click', async () => {
      const btn = $('paid-btn');
      btn.disabled = true;
      btn.textContent = 'Letting the seller know…';
      const { ok, data } = await api('/api/public', { action: 'paid', invoice: publicId });
      btn.disabled = false;
      btn.textContent = "I've paid";
      if (!ok) {
        $('paid-error').textContent = data.error || 'Could not reach the seller. Please message them on WhatsApp.';
        $('paid-error').hidden = false;
        return;
      }
      $('paid-error').hidden = true;
      state.invoice = data.invoice;
      state.store = data.store;
      render();
    });

    $('print-btn').addEventListener('click', () => window.print());

    (async function start() {
      if (!/^[0-9a-f]{16}$/.test(publicId)) return switchView('missing');
      const { ok, status, data } = await api('/api/public?invoice=' + encodeURIComponent(publicId));
      if (!ok) {
        if (status !== 404) {
          $('missing-title').textContent = 'Something went wrong';
          $('missing-text').textContent = "We couldn't load this invoice. Check your internet and try again.";
        }
        return switchView('missing');
      }
      state.invoice = data.invoice;
      state.store = data.store;
      render();
    })();
  </script>
</body>
</html>
