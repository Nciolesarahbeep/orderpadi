<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Invoice</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#12B76A">
  <!--meta-->
  <link rel="preload" href="/fredoka.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/ui.css">
  <script>try{var m=localStorage.getItem('op_mode');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>
  <script src="/ui.js"></script>
  <style>
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); }
    .view { display: none; }
    .view.active { display: block; animation: op-rise .4s cubic-bezier(.2, .9, .3, 1.2) both; }
    .loading { padding: 100px 0; text-align: center; color: var(--muted); font-weight: 700; }
    .loading .spinner { width: 34px; height: 34px; border-width: 4px; display: block; margin: 0 auto 12px; color: var(--theme); }

    .paper { position: relative; background: var(--card); border: var(--bw) solid var(--ink); border-radius: 26px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
    .paper-top { position: relative; overflow: hidden; background: var(--theme); color: var(--theme-ink); border-bottom: var(--bw) solid var(--ink); padding: 20px 20px 18px; }
    .paper-top .blob { width: 110px; height: 110px; right: -38px; top: -46px; }
    .head { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
    .mono { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--sun); color: #1B1530; border: var(--bw) solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; }
    .store { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
    .doc { font-size: 15px; font-weight: 800; margin: 2px 0 0; opacity: .85; }
    .pill { position: relative; z-index: 1; display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 800; padding: 3px 12px; border-radius: 999px; border: 2px solid var(--ink); }
    .pill.unpaid { background: var(--sun); color: #1B1530; }
    .pill.part_paid { background: var(--sun-soft); color: var(--text); }
    .pill.paid { background: var(--brand); color: #1B1530; }
    .pill.cancelled { background: var(--card-2); color: var(--muted); }
    .paper-body { padding: 18px 20px 20px; }
    .meta { display: flex; gap: 16px; margin: 0 0 6px; font-size: 15px; }
    .meta div { flex: 1; min-width: 0; }
    .meta .label { font-size: 13px; font-weight: 800; color: var(--muted); }
    .meta p { margin: 2px 0 0; overflow-wrap: anywhere; font-weight: 700; }
    .meta p.muted { font-weight: 500; }
    .lines { margin-top: 14px; border-top: 2px dashed var(--line); }
    .item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 2px dashed var(--line); }
    .item .thumb { flex: none; width: 46px; height: 46px; border-radius: 13px; border: 2px solid var(--ink); font-size: 19px; }
    .item .i-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
    .item .i-qty { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
    .item .i-total { font-family: var(--display); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 0; font-variant-numeric: tabular-nums; font-weight: 700; }
    .kv.sub { color: var(--muted); }
    .kv.total { padding-top: 12px; margin-top: 6px; border-top: var(--bw) solid var(--ink); font-family: var(--display); font-size: 24px; }
    .kv.due { color: var(--bad); font-size: 17px; }
    .stamp { position: absolute; top: 84px; right: 14px; z-index: 2; padding: 4px 16px; border: 4px solid var(--brand-text); color: var(--brand-text); border-radius: 12px; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: .12em; background: var(--card); transform: rotate(-14deg); animation: op-stamp .6s cubic-bezier(.2, .9, .3, 1.3) .2s both; box-shadow: 0 0 0 3px var(--card); }
    .notice { margin: 16px 0 0; padding: 12px 14px; border-radius: 16px; border: var(--bw) solid var(--ink); font-size: 15px; font-weight: 700; }
    .notice.ok { background: var(--brand); color: #1B1530; }
    .notice.off { background: var(--card-2); color: var(--muted); }
    .notice.wait { background: var(--sun); color: #1B1530; }

    .pay { background: var(--card); }
    .pay .card-label { color: var(--muted); }
    .amount { font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 10px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 2px solid var(--line); }
    .row b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; text-align: right; }
    .copy { border: 2px solid var(--ink); background: var(--sun); color: #1B1530; font: inherit; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 9px; cursor: pointer; margin-left: 8px; }
    .error { display: block; }

    /* review */
    .review-card .card-label { color: var(--muted); }
    .stars { display: flex; gap: 6px; margin-top: 6px; }
    .stars button { flex: 1; max-width: 62px; aspect-ratio: 1; padding: 6px; border: var(--bw) solid var(--ink); border-radius: 16px; background: var(--card-2); color: var(--muted); cursor: pointer; transition: transform .15s, background-color .15s; }
    .stars button svg { width: 100%; height: 100%; display: block; }
    .stars button.on { background: var(--sun); color: #1B1530; }
    .stars button.on svg path { fill: currentColor; }
    .stars button:active { transform: scale(.9); }
    .star-word { margin: 8px 0 0; font-family: var(--display); font-weight: 700; font-size: 18px; min-height: 24px; }
    .stars-show { display: flex; gap: 2px; color: #F5A400; }
    .stars-show svg { width: 22px; height: 22px; }
    .stars-show svg.off { color: var(--line); }
    .review-text { margin: 8px 0 0; font-weight: 600; white-space: pre-line; overflow-wrap: anywhere; }
    .seller-reply { margin-top: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card-2); }
    .seller-reply b { display: block; font-size: 14px; }
    .seller-reply p { margin: 2px 0 0; font-weight: 600; white-space: pre-line; overflow-wrap: anywhere; }
    .review-card .fine { font-size: 13px; color: var(--muted); text-align: center; margin: 10px 0 0; font-weight: 600; }
    /* tracking: where the order is up to */
    .track { margin: 0 0 16px; }
    .track-head { display: flex; align-items: center; gap: 12px; }
    .track-ico { flex: none; width: 50px; height: 50px; border-radius: 16px; border: var(--bw) solid var(--ink); background: var(--theme); color: var(--theme-ink); display: grid; place-items: center; }
    .track-ico svg { width: 28px; height: 28px; }
    .track-title { margin: 0; font-family: var(--display); font-size: 23px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
    .track-sub { margin: 2px 0 0; color: var(--muted); font-weight: 700; font-size: 15px; }
    .steps { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0 0; padding: 0; }
    .steps li { position: relative; text-align: center; font-size: 13px; line-height: 1.25; font-weight: 800; color: var(--muted); padding: 0 2px; }
    .steps li::before { content: ''; position: absolute; top: 12px; right: 50%; width: 100%; height: 4px; background: var(--line); }
    .steps li:first-child::before { display: none; }
    .steps li.done::before, .steps li.now::before { background: var(--text); }
    .steps .dot { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--theme-ink); }
    .steps .dot svg { width: 15px; height: 15px; }
    .steps li.done, .steps li.now { color: var(--text); }
    .steps li.done .dot, .steps li.now .dot { background: var(--theme); border-color: var(--ink); }
    .steps li.now .dot { animation: track-pulse 1.8s ease-out infinite; }
    .steps small { display: block; margin-top: 1px; font-weight: 600; font-size: 12px; color: var(--muted); }
    @keyframes track-pulse { 0% { box-shadow: 0 0 0 0 rgba(27, 21, 48, .35); } 70%, 100% { box-shadow: 0 0 0 10px rgba(27, 21, 48, 0); } }
    @media (prefers-reduced-motion: reduce) { .steps li.now .dot { animation: none; } }
    .track-rows { margin-top: 14px; }
    .track-rows .row .muted { font-weight: 700; }
    .track-rows .row > span:last-child { display: flex; align-items: center; justify-content: flex-end; gap: 0; min-width: 0; }
    .call { display: inline-block; border: 2px solid var(--ink); background: var(--sun); color: #1B1530; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 9px; margin-left: 8px; text-decoration: none; white-space: nowrap; }
    .slip-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0 0; margin-top: 2px; border: 0; border-top: 2px solid var(--line); background: none; color: var(--text); font: inherit; font-weight: 800; text-align: left; cursor: pointer; }
    .slip-btn img { width: 58px; height: 58px; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); background: var(--card-2); }
    .slip-btn small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
    .seller-note { margin-top: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card-2); }
    .seller-note b { display: block; font-size: 14px; }
    .seller-note p { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    .track .btn.theme { margin-top: 16px; }
    .track .fine { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 0; font-weight: 600; }
    .lightbox { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; background: rgba(27, 21, 48, .86); }
    .lightbox img { max-width: 100%; max-height: 78vh; border-radius: 16px; border: var(--bw) solid var(--ink); background: #fff; }
    .lightbox .btn { width: auto; min-width: 140px; }

    .missing { text-align: center; margin-top: 60px; }
    .missing svg { width: 110px; height: 110px; margin-bottom: 8px; }
    footer { margin-top: 30px; text-align: center; }
    .made-with b { color: var(--brand-text); }

    @media print {
      :root, :root[data-theme="dark"] { --ground: #fff; --card: #fff; --text: #000; --muted: #555; --ink: #000; --line: #ccc; color-scheme: light; }
      body { background: #fff; }
      main { padding: 0; max-width: none; }
      .no-print { display: none !important; }
      .paper { box-shadow: none; }
      .stamp { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="view active" id="view-loading"><div class="loading"><span class="spinner"></span>Loading invoice…</div></section>

    <section class="view" id="view-missing">
      <div class="missing">
        <svg viewBox="0 0 110 110" aria-hidden="true"><path d="M28 14h54v82l-9-6-9 6-9-6-9 6-9-6-9 6z" fill="#FFD23F" stroke="#1B1530" stroke-width="3.5" stroke-linejoin="round"/><path d="M40 36h30M40 50h18" stroke="#1B1530" stroke-width="3.5" stroke-linecap="round"/><circle cx="84" cy="74" r="16" fill="#FF8A7A" stroke="#1B1530" stroke-width="3.5"/><path d="M84 66v9M84 81v1" stroke="#1B1530" stroke-width="3.5" stroke-linecap="round"/></svg>
        <h1 id="missing-title" style="margin:0">Invoice not found</h1>
        <p class="sub" id="missing-text">Check the link with the seller.</p>
      </div>
    </section>

    <section class="view" id="view-invoice">
      <div class="card track no-print" id="track" hidden>
        <div class="track-head">
          <span class="track-ico" id="track-ico"></span>
          <div style="min-width:0"><p class="track-title" id="track-title"></p><p class="track-sub" id="track-sub"></p></div>
        </div>
        <ol class="steps" id="track-steps" aria-label="Order progress"></ol>
        <div class="track-rows" id="track-rows"></div>
        <button class="btn theme" type="button" id="got-btn" hidden>I've got it</button>
        <p class="fine" id="got-fine" hidden>Tap when your order arrives, so the seller knows.</p>
        <p class="error" id="got-error" hidden></p>
      </div>

      <div class="paper">
        <div class="stamp" id="stamp" hidden>PAID</div>
        <div class="paper-top">
          <span class="blob sun"></span>
          <div class="head">
            <span class="mono" id="inv-mono"></span>
            <div>
              <p class="store" id="inv-store"></p>
              <p class="doc" id="inv-doc"></p>
            </div>
          </div>
          <span class="pill" id="inv-pill"></span>
        </div>
        <div class="paper-body">
          <div class="meta">
            <div><span class="label">Date</span><p id="inv-date"></p></div>
            <div><span class="label">Billed to</span><p id="inv-customer"></p><p class="muted" id="inv-address"></p></div>
          </div>
          <div class="lines" id="inv-lines"></div>
          <div id="inv-totals" style="margin-top:8px"></div>
          <p class="notice" id="inv-notice" hidden></p>
        </div>
      </div>

      <div class="card pay no-print" id="pay-card" hidden>
        <p class="card-label">Amount to pay</p>
        <div class="amount" id="pay-amount"></div>
        <div id="pay-bank"></div>
        <button class="btn theme" type="button" id="paid-btn">I've paid</button>
        <p class="error" id="paid-error" hidden></p>
      </div>

      <div class="card no-print review-card" id="review" hidden>
        <p class="card-label" id="review-label">How was your order?</p>
        <div id="review-view" hidden>
          <div class="stars-show" id="review-stars"></div>
          <p class="review-text" id="review-text"></p>
          <div class="seller-reply" id="review-reply" hidden><b id="review-reply-name"></b><p id="review-reply-text"></p></div>
          <p class="center" style="margin:10px 0 0"><button class="link" type="button" id="review-edit" hidden>Change my review</button></p>
        </div>
        <form id="review-form" novalidate hidden>
          <div class="stars" id="star-pick" role="radiogroup" aria-label="Your rating"></div>
          <p class="star-word" id="star-word">Tap a star</p>
          <label for="review-body">Tell others about it <span class="muted">(optional)</span></label>
          <textarea id="review-body" maxlength="500" placeholder="What did you buy? How was the delivery?"></textarea>
          <p class="error" id="review-error" hidden></p>
          <button class="btn theme" type="submit" id="review-submit">Post review</button>
          <p class="fine" id="review-fine"></p>
        </form>
      </div>

      <div class="no-print">
        <a class="btn wa" id="chat-btn" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
          Message the seller on WhatsApp
        </a>
        <button class="btn secondary" type="button" id="print-btn">Save as PDF or print</button>
      </div>
    </section>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Waybill slip">
      <img id="lightbox-img" alt="Waybill slip">
      <button class="btn secondary" type="button" id="lightbox-close">Close</button>
    </div>

    <footer id="branding" hidden><a class="made-with" href="/">Made with Order<b>Padi</b></a></footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const publicId = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
    const state = { invoice: null, store: null, wasPaid: null, rating: 0, editingReview: false, scrolled: false };
    const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
    const STAR_WORDS = ['Tap a star', 'Poor', 'Not great', 'Okay', 'Good', 'Excellent!'];
    const THEME_HEX = { green: '#12B76A', coral: '#FF8A7A', sun: '#FFD23F', sky: '#6CCFF6', grape: '#6A4CE0', night: '#1B1530' };
    const TINTS = ['t0', 't1', 't2', 't3', 't4'];
    const tintFor = (text) => TINTS[[...String(text || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % TINTS.length];
    const initials = (name) => (String(name || '').replace(/['’]/g, '').match(/[A-Za-z0-9]+/g) || ['?']).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    // The seller's profile picture ("/p/<id>") in a tile, or their initials when there isn't one.
    const isPicture = (url) => typeof url === 'string' && /^\/p\/[0-9a-f]{16}$/.test(url);
    function paintPicture(node, url, name) {
      node.textContent = '';
      node.classList.toggle('has-pic', isPicture(url));
      if (!isPicture(url)) { node.textContent = initials(name); return; }
      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.onerror = () => { node.classList.remove('has-pic'); node.textContent = initials(name); };
      img.src = url;
      node.appendChild(img);
    }

    function formatNaira(kobo) {
      const decimals = kobo % 100 === 0 ? 0 : 2;
      return '₦' + (kobo / 100).toLocaleString('en-NG', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function kv(label, value, className) {
      const row = el('div', 'kv' + (className ? ' ' + className : ''));
      row.append(el('span', null, label), el('span', null, value));
      return row;
    }
    function fullDate(iso) {
      return new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function switchView(name) {
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
    }
    async function api(path, body) {
      try {
        const res = await fetch(path, body
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
          : { cache: 'no-store' });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        return { ok: false, status: 0, data: { error: "Can't connect. Check your internet and try again." } };
      }
    }

    const PILL = { unpaid: 'Unpaid', part_paid: 'Part paid', paid: 'Paid', cancelled: 'Cancelled' };

    function render() {
      const inv = state.invoice;
      const store = state.store;
      const cancelled = inv.status === 'cancelled';
      const paid = !cancelled && inv.paymentStatus === 'paid';
      const docName = paid ? 'Receipt' : 'Invoice';
      document.title = docName + ' #' + inv.number + ' · ' + store.businessName;
      const theme = THEME_HEX[store.theme] ? store.theme : 'green';
      document.documentElement.setAttribute('data-store', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_HEX[theme]);
      paintPicture($('inv-mono'), store.picture, store.businessName);

      $('inv-store').textContent = store.businessName;
      $('inv-doc').textContent = docName + ' #' + inv.number;
      const pillKind = cancelled ? 'cancelled' : inv.paymentStatus;
      $('inv-pill').className = 'pill ' + pillKind;
      $('inv-pill').textContent = PILL[pillKind];
      $('inv-pill').hidden = paid; // the PAID stamp says it instead
      $('stamp').hidden = !paid;
      $('inv-date').textContent = fullDate(inv.createdAt);
      $('inv-customer').textContent = inv.customerName;
      $('inv-address').textContent = inv.deliveryAddress;

      const lines = $('inv-lines');
      lines.textContent = '';
      inv.items.forEach((i) => {
        const row = el('div', 'item');
        const thumb = el('div', 'thumb ph ' + tintFor(i.name));
        if (i.photo) {
          const img = document.createElement('img');
          img.alt = '';
          img.src = i.photo;
          OP.fadeImage(img);
          thumb.appendChild(img);
        } else {
          thumb.textContent = initials(i.name).slice(0, 1);
        }
        const name = el('div', 'i-name', i.name);
        name.appendChild(el('span', 'i-qty', i.quantity + ' × ' + formatNaira(i.unitPriceKobo)));
        row.append(thumb, name, el('span', 'i-total', formatNaira(i.lineTotalKobo)));
        lines.appendChild(row);
      });

      const totals = $('inv-totals');
      totals.textContent = '';
      totals.appendChild(kv('Subtotal', formatNaira(inv.subtotalKobo), 'sub'));
      if (inv.deliveryFeeKobo || inv.deliveryZone) totals.appendChild(kv('Delivery' + (inv.deliveryZone ? ' · ' + inv.deliveryZone : ''), formatNaira(inv.deliveryFeeKobo), 'sub'));
      if (inv.discountKobo) totals.appendChild(kv('Discount' + (inv.promoCode ? ' · ' + inv.promoCode : ''), '−' + formatNaira(inv.discountKobo), 'sub'));
      totals.appendChild(kv('Total', formatNaira(inv.totalKobo), 'total'));
      if (inv.amountPaidKobo && !cancelled) {
        totals.appendChild(kv('Paid', formatNaira(inv.amountPaidKobo), 'sub'));
        if (inv.balanceKobo) totals.appendChild(kv('Still to pay', formatNaira(inv.balanceKobo), 'due'));
      }

      const notice = $('inv-notice');
      notice.hidden = true;
      if (cancelled) {
        notice.className = 'notice off';
        notice.textContent = 'This order was cancelled. Contact ' + store.businessName + ' if you have questions.';
        notice.hidden = false;
      } else if (paid) {
        const last = inv.payments[inv.payments.length - 1];
        notice.className = 'notice ok';
        notice.textContent = 'Paid in full' + (last ? ' · ' + fullDate(last.paidAt) : '') + '. Thank you!';
        notice.hidden = false;
      } else if (inv.customerMarkedPaidAt) {
        notice.className = 'notice wait';
        notice.textContent = 'You told ' + store.businessName + ' you paid on ' + fullDate(inv.customerMarkedPaidAt) + '. They\'ll confirm it soon.';
        notice.hidden = false;
      }

      // How to pay (only while money is owed)
      const owed = !cancelled && inv.balanceKobo > 0;
      $('pay-card').hidden = !owed;
      if (owed) {
        $('pay-amount').textContent = formatNaira(inv.balanceKobo);
        const bank = $('pay-bank');
        bank.textContent = '';
        if (store.bank) {
          [['Bank', store.bank.name], ['Account number', store.bank.accountNumber], ['Account name', store.bank.accountName]].forEach(([label, value]) => {
            const row = el('div', 'row');
            row.appendChild(el('span', 'muted', label));
            const right = el('span');
            right.appendChild(el('b', null, value));
            if (label === 'Account number') {
              const copy = el('button', 'copy', 'Copy');
              copy.type = 'button';
              copy.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; }
                catch (e) { copy.textContent = 'Hold to copy'; }
                setTimeout(() => { copy.textContent = 'Copy'; }, 2000);
              });
              right.appendChild(copy);
            }
            row.appendChild(right);
            bank.appendChild(row);
          });
        } else {
          bank.appendChild(el('p', 'muted', store.businessName + ' will send you their payment details.'));
        }
        $('paid-btn').hidden = !!inv.customerMarkedPaidAt;
      }

      if (store.whatsappPhone) {
        const text = 'Hi ' + store.businessName + ', about my order #' + inv.number + ': ' + location.href;
        $('chat-btn').href = 'https://wa.me/' + store.whatsappPhone + '?text=' + encodeURIComponent(text);
        $('chat-btn').hidden = false;
      }
      $('branding').hidden = !store.branded;
      renderTrack();
      renderReview();
      switchView('invoice');
      if (!state.scrolled && location.hash === '#review' && !$('review').hidden) {
        state.scrolled = true;
        setTimeout(() => $('review').scrollIntoView({ block: 'center', behavior: OP.reducedMotion ? 'auto' : 'smooth' }), 150);
      }
      if (!state.scrolled && location.hash === '#track' && !$('track').hidden) {
        state.scrolled = true;
        setTimeout(() => $('track').scrollIntoView({ block: 'start', behavior: OP.reducedMotion ? 'auto' : 'smooth' }), 150);
      }
      // Celebrate when the receipt turns paid while it's open.
      if (state.wasPaid === false && paid) OP.confetti($('stamp'));
      state.wasPaid = paid;
    }

    $('paid-btn').addEventListener('click', async () => {
      const btn = $('paid-btn');
      btn.disabled = true;
      btn.textContent = 'Letting the seller know…';
      const { ok, data } = await api('/api/public', { action: 'paid', invoice: publicId });
      btn.disabled = false;
      btn.textContent = "I've paid";
      if (!ok) {
        $('paid-error').textContent = data.error || 'Could not reach the seller. Please message them on WhatsApp.';
        $('paid-error').hidden = false;
        return;
      }
      $('paid-error').hidden = true;
      state.invoice = data.invoice;
      state.store = data.store;
      render();
      OP.buzz(15);
    });

    $('print-btn').addEventListener('click', () => window.print());

    // ---------- tracking ----------
    // Shown once the seller starts on the order: getting it ready, on the
    // way (with the rider or waybill details), delivered.
    const ICON = (paths) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
    const TRACK_ICONS = {
      processing: ICON('<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>'),
      sent: ICON('<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'),
      delivered: ICON('<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/>')
    };
    const TICK = ICON('<path d="M5 12l5 5L20 7"/>').replace('stroke-width="2.3"', 'stroke-width="3.4"');
    const STEP_ORDER = ['placed', 'processing', 'sent', 'delivered'];
    const STEP_NAMES = { placed: 'Order placed', processing: 'Getting ready', sent: 'On the way', delivered: 'Delivered' };

    // Days in Lagos time, as the seller's phone sees them.
    const lagosDay = (date) => new Date(date).toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
    function shortDate(iso) { return new Date(iso).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', timeZone: 'Africa/Lagos' }); }
    // "2026-11-14" -> "today", "tomorrow" or "on Friday 14 November"
    function dayWords(day) {
      const today = lagosDay(Date.now());
      if (day === today) return 'today';
      if (day === lagosDay(Date.now() + 86400000)) return 'tomorrow';
      if (day === lagosDay(Date.now() - 86400000)) return 'yesterday';
      const [y, m, d] = String(day).split('-').map(Number);
      return 'on ' + new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('en-NG', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    }
    // An ISO time -> "today", "yesterday" or "on Tuesday 11 November"
    const timeWords = (iso) => dayWords(lagosDay(iso));
    function localPhone(p) {
      const local = String(p || '').replace(/^234/, '0');
      return local.length === 11 ? local.slice(0, 4) + ' ' + local.slice(4, 7) + ' ' + local.slice(7) : local;
    }
    function copyButton(value) {
      const copy = el('button', 'copy', 'Copy');
      copy.type = 'button';
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; }
        catch (e) { copy.textContent = 'Hold to copy'; }
        setTimeout(() => { copy.textContent = 'Copy'; }, 2000);
      });
      return copy;
    }
    function trackRow(label, value, extra) {
      const row = el('div', 'row');
      row.appendChild(el('span', 'muted', label));
      const right = el('span');
      right.appendChild(el('b', null, value));
      if (extra) right.appendChild(extra);
      row.appendChild(right);
      return row;
    }

    function renderTrack() {
      const inv = state.invoice;
      const t = inv.tracking;
      const box = $('track');
      box.hidden = !t || inv.status === 'cancelled';
      if (box.hidden) return;
      const store = state.store.businessName;
      $('track-ico').innerHTML = TRACK_ICONS[t.step];
      if (t.step === 'processing') {
        $('track-title').textContent = 'Getting your order ready';
        $('track-sub').textContent = t.processingAt ? store + ' started on it ' + timeWords(t.processingAt) + '.' : store + ' is preparing it.';
      } else if (t.step === 'sent') {
        $('track-title').textContent = 'Your order is on its way';
        $('track-sub').textContent = t.expectedOn ? 'It should arrive ' + dayWords(t.expectedOn) + '.' : (t.sentAt ? 'Sent out ' + timeWords(t.sentAt) + '.' : 'Sent out.');
      } else {
        $('track-title').textContent = 'Delivered';
        $('track-sub').textContent = (t.deliveredAt ? 'It arrived ' + timeWords(t.deliveredAt) : 'Your order arrived') + (t.youConfirmed ? '. You confirmed it.' : '.');
      }

      // The four steps, done up to where it is now.
      const at = STEP_ORDER.indexOf(t.step);
      const dates = { placed: t.placedAt, processing: t.processingAt, sent: t.sentAt, delivered: t.deliveredAt };
      const steps = $('track-steps');
      steps.textContent = '';
      STEP_ORDER.forEach((name, i) => {
        const li = el('li', i < at ? 'done' : i === at ? (name === 'delivered' ? 'done' : 'now') : '');
        if (i === at) li.setAttribute('aria-current', 'step');
        const dot = el('span', 'dot');
        if (i < at || (i === at && name === 'delivered')) dot.innerHTML = TICK;
        li.append(dot, document.createTextNode(STEP_NAMES[name]));
        if (i <= at && dates[name]) li.appendChild(el('small', null, shortDate(dates[name])));
        steps.appendChild(li);
      });

      // How it's travelling.
      const rows = $('track-rows');
      rows.textContent = '';
      const c = t.courier;
      if (c && c.kind === 'rider') {
        if (c.name || c.phone) {
          let call = null;
          if (c.phone) {
            call = el('a', 'call', 'Call');
            call.href = 'tel:+' + c.phone;
          }
          rows.appendChild(trackRow('Rider', [c.name, c.phone ? localPhone(c.phone) : ''].filter(Boolean).join(' · '), call));
        }
      } else if (c && c.kind === 'waybill') {
        rows.appendChild(trackRow('Sent by', c.name || 'Waybill'));
        if (c.code) rows.appendChild(trackRow('Waybill no.', c.code, copyButton(c.code)));
      }
      if (t.photo) {
        const slip = el('button', 'slip-btn');
        slip.type = 'button';
        const img = document.createElement('img');
        img.alt = '';
        img.src = t.photo;
        const words = el('span', null, 'Waybill slip');
        words.appendChild(el('small', null, 'Tap to see it bigger'));
        slip.append(img, words);
        slip.addEventListener('click', () => openLightbox(t.photo));
        rows.appendChild(slip);
      }
      if (t.message) {
        const note = el('div', 'seller-note');
        note.append(el('b', null, 'Note from ' + store), el('p', null, t.message));
        rows.appendChild(note);
      }

      const out = t.step === 'sent';
      $('got-btn').hidden = !out;
      $('got-fine').hidden = !out;
      if (!out) $('got-error').hidden = true;
    }

    $('got-btn').addEventListener('click', async () => {
      if (!confirm('Has your order arrived? We\'ll let ' + state.store.businessName + ' know.')) return;
      const btn = $('got-btn');
      btn.disabled = true;
      btn.textContent = 'Letting the seller know…';
      const { ok, data } = await api('/api/public', { action: 'received', invoice: publicId });
      btn.disabled = false;
      btn.textContent = "I've got it";
      if (!ok) {
        $('got-error').textContent = data.error || 'Could not reach the seller. Please message them on WhatsApp.';
        $('got-error').hidden = false;
        return;
      }
      $('got-error').hidden = true;
      state.invoice = data.invoice;
      state.store = data.store;
      render();
      OP.confetti($('track-ico'));
      OP.buzz(20);
      // Now they can rate it.
      if (!$('review').hidden) setTimeout(() => $('review').scrollIntoView({ block: 'center', behavior: OP.reducedMotion ? 'auto' : 'smooth' }), 700);
    });

    function openLightbox(src) {
      $('lightbox-img').src = src;
      $('lightbox').hidden = false;
      $('lightbox-close').focus();
    }
    function closeLightbox() { $('lightbox').hidden = true; }
    $('lightbox').addEventListener('click', (e) => { if (e.target !== $('lightbox-img')) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('lightbox').hidden) closeLightbox(); });

    // ---------- rating the order ----------
    function starsShow(n) {
      const box = el('div', 'stars-show');
      box.setAttribute('aria-label', n + ' out of 5 stars');
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('span');
        s.innerHTML = STAR.replace('fill="none"', 'fill="currentColor"');
        if (i > n) s.firstChild.classList.add('off');
        box.appendChild(s.firstChild);
      }
      return box;
    }
    function paintStars() {
      document.querySelectorAll('#star-pick button').forEach((b, i) => {
        b.classList.toggle('on', i < state.rating);
        b.setAttribute('aria-checked', String(i + 1 === state.rating));
      });
      $('star-word').textContent = STAR_WORDS[state.rating];
    }
    for (let i = 1; i <= 5; i++) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-label', i + (i === 1 ? ' star' : ' stars'));
      b.innerHTML = STAR;
      b.addEventListener('click', () => {
        state.rating = i;
        paintStars();
        OP.buzz(8);
        OP.replay(b, 'bump');
        $('review-error').hidden = true;
      });
      $('star-pick').appendChild(b);
    }
    function renderReview() {
      const inv = state.invoice;
      const r = inv.review;
      const can = !!inv.canReview;
      $('review').hidden = !(can || r);
      if ($('review').hidden) return;
      const editing = can && (!r || state.editingReview);
      $('review-view').hidden = editing;
      $('review-form').hidden = !editing;
      $('review-label').textContent = editing ? (r ? 'Change your review' : 'How was your order?') : 'Your review';
      if (!editing) {
        $('review-stars').replaceWith(Object.assign(starsShow(r.rating), { id: 'review-stars' }));
        $('review-text').textContent = r.body;
        $('review-text').hidden = !r.body;
        $('review-reply').hidden = !r.reply;
        $('review-reply-name').textContent = 'Reply from ' + state.store.businessName;
        $('review-reply-text').textContent = r.reply;
        $('review-edit').hidden = !can;
      } else {
        $('review-fine').textContent = 'Other shoppers see it on the store with your first name.';
        $('review-submit').textContent = r ? 'Save my review' : 'Post review';
        paintStars();
      }
    }
    $('review-edit').addEventListener('click', () => {
      const r = state.invoice.review;
      state.editingReview = true;
      state.rating = r.rating;
      $('review-body').value = r.body;
      renderReview();
    });
    $('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const showErr = (t) => { $('review-error').textContent = t; $('review-error').hidden = false; };
      if (!state.rating) return showErr('Tap the stars to choose a rating.');
      const btn = $('review-submit');
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Posting…';
      const { ok, data } = await api('/api/public', { action: 'review', invoice: publicId, rating: state.rating, body: $('review-body').value });
      btn.disabled = false;
      btn.textContent = label;
      if (!ok) return showErr(data.error || 'Could not post your review. Please try again.');
      $('review-error').hidden = true;
      const first = !state.invoice.review;
      state.invoice = data.invoice;
      state.store = data.store;
      state.editingReview = false;
      render();
      if (first) OP.confetti($('review'));
      OP.buzz(15);
    });

    // While money is owed or the order is still coming, check now and then,
    // so the receipt and the tracker update as soon as the seller does something.
    setInterval(async () => {
      const inv = state.invoice;
      if (!inv || document.hidden || inv.status === 'cancelled') return;
      if (inv.paymentStatus === 'paid' && inv.status === 'delivered') return;
      if (!$('lightbox').hidden) return;
      const { ok, data } = await api('/api/public?invoice=' + encodeURIComponent(publicId));
      if (!ok) return;
      const changed = data.invoice.paymentStatus !== inv.paymentStatus || data.invoice.amountPaidKobo !== inv.amountPaidKobo || data.invoice.status !== inv.status ||
        JSON.stringify(data.invoice.tracking) !== JSON.stringify(inv.tracking);
      if (changed) { state.invoice = data.invoice; state.store = data.store; render(); }
    }, 20000);

    (async function start() {
      if (!/^[0-9a-f]{16}$/.test(publicId)) return switchView('missing');
      const { ok, status, data } = await api('/api/public?invoice=' + encodeURIComponent(publicId));
      if (!ok) {
        if (status !== 404) {
          $('missing-title').textContent = 'Something went wrong';
          $('missing-text').textContent = "We couldn't load this invoice. Check your internet and try again.";
        }
        return switchView('missing');
      }
      state.invoice = data.invoice;
      state.store = data.store;
      render();
    })();
  </script>
</body>
</html>
