<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderPadi — orders and invoices for WhatsApp sellers</title>
  <meta name="description" content="Take orders, send invoices and see who still owes you. Built for WhatsApp and Instagram sellers in Nigeria.">
  <style>
    :root { --bg:#f6f6f3; --card:#ffffff; --ink:#141414; --muted:#6b6b66; --line:#e4e4de; --accent:#0a7d4f; --accent-ink:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101010; --card:#1a1a1a; --ink:#f2f2ef; --muted:#a3a39d; --line:#2a2a28; --accent:#2fbf7f; --accent-ink:#0b1f15; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    main { max-width:480px; margin:0 auto; padding:56px 20px; }
    .logo { font-weight:700; font-size:20px; letter-spacing:-0.02em; }
    .logo span { color:var(--accent); }
    h1 { font-size:34px; line-height:1.15; letter-spacing:-0.03em; margin:40px 0 16px; }
    p { color:var(--muted); font-size:17px; margin:0 0 28px; }
    .pill { display:inline-block; padding:4px 12px; border:1px solid var(--line); border-radius:999px; font-size:13px; color:var(--muted); background:var(--card); }
    .btn { display:block; text-align:center; margin-top:32px; padding:15px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Order<span>Padi</span></div>
    <h1>Take orders. Send invoices. Know who owes you.</h1>
    <p>One link for your customers to order from, a clean invoice for every sale, and a list of who has paid and who hasn't. Built for WhatsApp and Instagram sellers.</p>
    <span class="pill">Coming soon</span>
    <a class="btn" href="/app">Vendor login</a>
  </main>
</body>
</html>
