<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OrderPadi — Setup check</title>
  <style>
    :root { --bg:#f6f6f3; --card:#ffffff; --ink:#141414; --muted:#6b6b66; --line:#e4e4de; --accent:#0a7d4f; --good:#0a7d4f; --bad:#c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101010; --card:#1a1a1a; --ink:#f2f2ef; --muted:#a3a39d; --line:#2a2a28; --accent:#2fbf7f; --good:#2fbf7f; --bad:#ff6b5b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
    main { max-width:480px; margin:0 auto; padding:40px 16px; }
    .logo { font-weight:700; font-size:20px; letter-spacing:-0.02em; }
    .logo span { color:var(--accent); }
    h1 { font-size:24px; margin:28px 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    .row { display:flex; gap:12px; padding:14px 16px; border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .icon { width:22px; flex:none; font-weight:700; }
    .ok .icon { color:var(--good); }
    .fail .icon { color:var(--bad); }
    .detail { display:block; color:var(--muted); font-size:14px; }
    h2 { font-size:16px; margin:28px 0 8px; }
    a { color:var(--accent); }
    ul { margin:0; padding-left:20px; }
    li { margin:6px 0; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Order<span>Padi</span></div>
    <h1>Setup check</h1>
    <p class="sub">Every row should show a tick before you start step 2.</p>

    <div class="card" id="checks">
      <div class="row"><span class="icon">…</span><span>Checking…</span></div>
    </div>

    <h2>Test the links</h2>
    <ul>
      <li><a href="/s/test-store">/s/test-store</a> should open the store page</li>
      <li><a href="/i/abc123">/i/abc123</a> should open the invoice page</li>
      <li><a href="/admin">/admin</a> should open the admin page</li>
    </ul>
  </main>

  <script>
    const box = document.getElementById('checks');

    function addRow(label, ok, detail) {
      const row = document.createElement('div');
      row.className = 'row ' + (ok ? 'ok' : 'fail');
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = ok ? '✓' : '✗';
      const text = document.createElement('span');
      text.textContent = label;
      if (detail) {
        const small = document.createElement('span');
        small.className = 'detail';
        small.textContent = detail;
        text.appendChild(small);
      }
      row.append(icon, text);
      box.appendChild(row);
    }

    fetch('/api/health', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        box.innerHTML = '';
        const env = d.env || {};
        const missing = d.missing || [];
        addRow('DATABASE_URL set', !!env.DATABASE_URL, env.DATABASE_URL ? '' : 'Add it in Vercel → Settings → Environment Variables, then redeploy.');
        addRow('Database connected', d.db === true, d.db ? '' : (d.error || ''));
        addRow('All 11 tables and 2 views created', d.db === true && missing.length === 0,
          missing.length ? 'Missing: ' + missing.join(', ') + '. Run schema.sql in the Neon SQL Editor.' : '');
        addRow('JWT_SECRET set', !!env.JWT_SECRET, env.JWT_SECRET ? '' : 'Add a long random string, then redeploy.');
        addRow('RESEND_API_KEY set', !!env.RESEND_API_KEY, env.RESEND_API_KEY ? '' : 'Add your Resend key, then redeploy.');
      })
      .catch(() => {
        box.innerHTML = '';
        addRow('API reachable', false, 'Could not reach /api/health. Check the latest deployment in Vercel.');
      });
  </script>
</body>
</html>
