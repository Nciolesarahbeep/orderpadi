# Netlify settings. The static pages are copied into public/ at build time;
# netlify/functions/app.mjs serves the API and the link-preview pages.
[build]
  command = "mkdir -p public && cp *.html *.png *.svg *.txt *.webmanifest *.woff ui.css ui.js sw.js public/"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["*.html"]

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The service worker must always be fresh, and may look after the whole site.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/ui.*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
