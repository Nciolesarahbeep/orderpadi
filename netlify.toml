# Netlify settings. The static pages are copied into public/ at build time;
# netlify/functions/app.mjs serves the API and the link-preview pages.
[build]
  # Install the three server packages, then copy the static pages to public/.
  command = "npm install --no-audit --no-fund && mkdir -p public && cp *.html *.png *.svg *.txt *.webmanifest public/ && (pwd; node -v; npm -v; ls -la; ls node_modules; node -e \"console.log(require.resolve('@neondatabase/serverless'))\"; env | grep -i -E 'NETLIFY|NODE|NPM' | grep -v -i -E 'TOKEN|SECRET|KEY|DATABASE') > public/build-info.txt 2>&1 || true"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["*.html"]
  # Ship these packages alongside the function instead of bundling them.
  external_node_modules = ["@neondatabase/serverless", "bcryptjs", "jsonwebtoken"]

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
