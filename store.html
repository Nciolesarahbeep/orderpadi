<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order online</title>
  <meta name="description" content="Order online and pay by bank transfer.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#12B76A">
  <!--meta-->
  <link rel="preload" href="/fredoka.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/ui.css">
  <script>try{var m=localStorage.getItem('op_mode');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>
  <script src="/ui.js"></script>
  <style>
    main { max-width: 520px; margin: 0 auto; padding: 0 16px calc(130px + env(safe-area-inset-bottom)); }
    .view { display: none; }
    .view.active { display: block; animation: op-fade .3s both; }
    .loading { padding: 100px 0; text-align: center; color: var(--muted); font-weight: 700; }
    .loading .spinner { width: 34px; height: 34px; border-width: 4px; color: var(--theme); display: block; margin: 0 auto 12px; }

    /* store header in the seller's colour */
    .store-top { position: relative; overflow: hidden; margin: 0 -16px; padding: 26px 20px 24px; background: var(--theme); color: var(--theme-ink); border-bottom: var(--bw) solid var(--ink); }
    .store-top > :not(.blob):not(.sparkle) { position: relative; z-index: 1; }
    .store-head { display: flex; align-items: center; gap: 14px; }
    .mono { flex: none; width: 62px; height: 62px; border-radius: 19px; background: var(--sun); color: #1B1530; border: var(--bw) solid var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; font-family: var(--display); font-size: 24px; font-weight: 700; }
    .store-top h1 { margin: 0; font-size: 30px; overflow-wrap: anywhere; }
    .store-top p { margin: 3px 0 0; font-size: 15px; font-weight: 700; opacity: .9; }
    .chat { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 9px 16px; border: var(--bw) solid var(--ink); border-radius: 999px; background: #fff; color: #1B1530; text-decoration: none; font-size: 15px; font-weight: 800; box-shadow: var(--shadow-sm); }
    .chat:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .chat svg { width: 19px; height: 19px; color: #1fa855; }
    .store-top .sparkle { width: 30px; height: 30px; right: 104px; top: 22px; z-index: 0; }
    .mode { margin: 16px 0 0; padding: 12px 14px; border-radius: 16px; border: var(--bw) solid var(--ink); background: var(--sun); color: #1B1530; font-size: 15px; font-weight: 800; }
    .section-row { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 12px; }
    .section-row h2 { margin: 0; }

    /* products */
    #product-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product { position: relative; display: flex; flex-direction: column; background: var(--card); border: var(--bw) solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
    .p-photo { position: relative; aspect-ratio: 1; border: 0; border-bottom: var(--bw) solid var(--ink); padding: 0; width: 100%; font-size: 46px; cursor: pointer; }
    .p-photo .more { position: absolute; right: 8px; bottom: 8px; display: inline-flex; gap: 3px; }
    .p-photo .more i { width: 7px; height: 7px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
    .p-body { display: flex; flex-direction: column; flex: 1; padding: 10px 12px 12px; min-width: 0; }
    .p-name { font-weight: 800; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
    .p-desc { font-size: 13px; color: var(--muted); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
    .p-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 8px; min-height: 46px; }
    .p-foot .stepper { margin-left: auto; }
    .p-price { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .add { flex: none; width: 40px; height: 40px; border-radius: 13px; border: var(--bw) solid var(--ink); background: var(--theme); color: var(--theme-ink); box-shadow: var(--shadow-sm); display: grid; place-items: center; padding: 0; cursor: pointer; transition: transform .12s, box-shadow .12s; }
    .add:active { transform: translateY(2px) scale(.94); box-shadow: 0 1px 0 var(--ink); }
    .add svg { width: 20px; height: 20px; }
    .stepper { flex: none; display: flex; align-items: center; border: var(--bw) solid var(--ink); border-radius: 13px; overflow: hidden; background: var(--card); animation: op-pop .35s cubic-bezier(.2, .9, .3, 1.5); }
    .stepper button { width: 32px; height: 36px; border: 0; background: var(--sun); color: #1B1530; font: inherit; font-size: 19px; font-weight: 800; cursor: pointer; padding: 0; }
    .stepper span { min-width: 26px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
    #product-list > .empty { grid-column: 1 / -1; }

    /* cart bar */
    .cartbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); z-index: 20; pointer-events: none; animation: op-rise .45s cubic-bezier(.2, .9, .3, 1.3) both; }
    .cartbar button { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 492px; margin: 0 auto; padding: 13px 16px; border: var(--bw) solid var(--ink); border-radius: 20px; background: var(--theme); color: var(--theme-ink); box-shadow: var(--shadow); font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    .cartbar button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .cartbar .count { display: inline-block; background: var(--sun); color: #1B1530; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
    .cartbar.wa button { background: var(--wa); color: #1B1530; }
    .cartbar svg { width: 20px; height: 20px; flex: none; }

    /* photo viewer */
    .viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--overlay); animation: op-fade .2s both; }
    .viewer-card { margin-top: auto; background: var(--card); border-top: var(--bw) solid var(--ink); border-radius: 30px 30px 0 0; padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 94vh; overflow-y: auto; animation: op-sheet .45s cubic-bezier(.2, .9, .3, 1.15) both; width: 100%; max-width: 520px; margin-left: auto; margin-right: auto; }
    .viewer-close { float: right; width: 44px; height: 44px; border-radius: 14px; border: var(--bw) solid var(--ink); background: var(--card-2); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
    .viewer-close svg { width: 18px; height: 18px; }
    .slides { clear: both; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; margin: 8px 0 0; border-radius: 20px; scrollbar-width: none; }
    .slides::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 1; border: var(--bw) solid var(--ink); border-radius: 20px; font-size: 90px; }
    .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; min-height: 12px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); transition: background-color .2s, transform .2s; }
    .dots i.on { background: var(--theme); transform: scale(1.2); }
    .viewer h2 { margin: 12px 0 2px; }
    .viewer .v-price { font-family: var(--display); font-weight: 700; font-size: 24px; }
    .viewer .v-desc { color: var(--muted); font-weight: 500; margin: 6px 0 0; white-space: pre-line; }

    /* checkout */
    .page-title { margin: 18px 0 4px; }
    .card.lines { padding: 6px 16px; }
    .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px solid var(--line); }
    .line:first-child { border-top: 0; }
    .line .thumb { flex: none; width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--ink); font-size: 20px; }
    .line .l-main { flex: 1; min-width: 0; }
    .line .l-name { font-weight: 800; overflow-wrap: anywhere; }
    .line .l-sub { font-size: 14px; color: var(--muted); font-weight: 600; }
    .sum { display: flex; justify-content: space-between; padding: 7px 0; font-variant-numeric: tabular-nums; font-weight: 700; }
    .sum.total { border-top: 2px solid var(--line); margin-top: 4px; padding-top: 12px; font-family: var(--display); font-size: 22px; }
    .totals { background: var(--sun); color: #1B1530; }
    .fine { font-size: 14px; color: var(--muted); text-align: center; margin: 14px 0 0; font-weight: 600; }

    /* done */
    .done-head { text-align: center; margin: 26px 0 4px; }
    .done-icon { width: 92px; height: 92px; margin: 0 auto 14px; animation: op-pop .6s cubic-bezier(.2, .9, .3, 1.6) both; }
    .done-head h1 { margin: 0; }
    .done-head p { color: var(--muted); margin: 8px 0 0; font-weight: 600; }
    .pay { background: var(--card); }
    .pay-label { font-size: 14px; color: var(--muted); margin: 0; font-weight: 800; }
    .pay-amount { font-family: var(--display); font-size: 38px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
    .pay-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 2px solid var(--line); }
    .pay-row b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; text-align: right; }
    .copy { border: 2px solid var(--ink); background: var(--sun); color: #1B1530; font: inherit; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 9px; cursor: pointer; margin-left: 8px; }
    .links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 18px; }
    .links a, .links button { color: var(--grape-text); font-weight: 800; background: none; border: 0; font: inherit; cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
    .missing { text-align: center; margin-top: 60px; }
    .missing svg { width: 120px; height: 120px; margin-bottom: 10px; }

    footer { margin-top: 34px; text-align: center; }
    .made-with b { color: var(--brand-text); }
  </style>
</head>
<body>
  <main>
    <section class="view active" id="view-loading"><div class="loading"><span class="spinner"></span>Loading store…</div></section>

    <section class="view" id="view-missing">
      <div class="missing">
        <svg viewBox="0 0 120 120" aria-hidden="true"><path d="M24 46h72l-6 56a5 5 0 0 1-5 4.5H35a5 5 0 0 1-5-4.5z" fill="#CDB8FF" stroke="#1B1530" stroke-width="3.5" stroke-linejoin="round"/><path d="M43 46v-8a17 17 0 0 1 34 0v8" fill="none" stroke="#1B1530" stroke-width="3.5" stroke-linecap="round"/><path d="M47 70l8 8M55 70l-8 8M65 70l8 8M73 70l-8 8" stroke="#1B1530" stroke-width="3.5" stroke-linecap="round"/><path d="M50 92c6-5 14-5 20 0" fill="none" stroke="#1B1530" stroke-width="3.5" stroke-linecap="round"/><circle cx="98" cy="22" r="10" fill="#FFD23F" stroke="#1B1530" stroke-width="3"/></svg>
        <h1>Store not found</h1>
        <p class="sub" id="missing-text">Check the link with the seller.</p>
      </div>
    </section>

    <!-- Products -->
    <section class="view" id="view-shop">
      <header class="store-top">
        <span class="blob sun" style="width:150px;height:150px;right:-50px;top:-60px;background:#FFD23F"></span>
        <span class="blob sky" style="width:70px;height:70px;right:30px;bottom:-34px;transform:rotate(18deg)"></span>
        <svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z" fill="#fff" stroke="#1B1530" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div class="store-head">
          <div class="mono" id="store-initials"></div>
          <div>
            <h1 id="store-name"></h1>
            <p id="store-delivery"></p>
          </div>
        </div>
        <a class="chat" id="store-chat" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
          Chat with the seller
        </a>
      </header>
      <p class="mode" id="shop-mode" hidden></p>
      <p class="error" id="shop-error"></p>
      <div class="section-row"><h2 id="products-title">Products</h2><span class="muted" id="products-count"></span></div>
      <div id="product-list"></div>
    </section>

    <!-- Checkout -->
    <section class="view" id="view-checkout">
      <button class="back" type="button" data-go="shop">‹ Keep shopping</button>
      <h1 class="page-title">Your order</h1>
      <div class="card lines" id="checkout-lines"></div>
      <div class="card totals">
        <div class="sum"><span>Subtotal</span><span id="sum-subtotal"></span></div>
        <div class="sum" id="sum-delivery-row"><span>Delivery</span><span id="sum-delivery"></span></div>
        <div class="sum total"><span>Total</span><span id="sum-total"></span></div>
      </div>
      <form id="checkout-form" class="card" novalidate>
        <label for="checkout-name" style="margin-top:0">Your name</label>
        <input id="checkout-name" type="text" autocomplete="name" maxlength="80">
        <label for="checkout-phone">Phone number</label>
        <input id="checkout-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0803 123 4567">
        <label for="checkout-address">Delivery address</label>
        <textarea id="checkout-address" autocomplete="street-address" maxlength="300" placeholder="House number, street, area, city"></textarea>
        <label for="checkout-note">Note for the seller <span class="muted">(optional)</span></label>
        <input id="checkout-note" type="text" maxlength="300" placeholder="e.g. Colour, size, best time to deliver">
        <p class="error" id="checkout-error"></p>
        <button class="btn theme" type="submit" id="checkout-submit">Place order</button>
      </form>
      <p class="fine">You'll pay the seller by bank transfer. They'll confirm your order on WhatsApp.</p>
    </section>

    <!-- Order placed -->
    <section class="view" id="view-done">
      <div class="done-head">
        <svg class="done-icon" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="48" r="40" fill="#1B1530"/><circle cx="46" cy="44" r="40" fill="#12B76A" stroke="#1B1530" stroke-width="3"/><path d="M28 45l12 12 24-26" fill="none" stroke="#1B1530" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 8l2.5 7.5L88 18l-7.5 2.5L78 28l-2.5-7.5L68 18l7.5-2.5z" fill="#FFD23F" stroke="#1B1530" stroke-width="2" stroke-linejoin="round"/></svg>
        <h1 id="done-title">Order placed</h1>
        <p id="done-text"></p>
      </div>
      <a class="btn wa" id="done-whatsapp" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
        Send order on WhatsApp
      </a>
      <div class="card pay" id="done-pay"></div>
      <div class="card lines" id="done-lines"></div>
      <div class="links">
        <a id="done-invoice" href="#">View invoice</a>
        <button type="button" data-go="shop">Order something else</button>
      </div>
    </section>

    <footer id="branding" hidden><a class="made-with" href="/">Made with Order<b>Padi</b></a></footer>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <button type="button" id="cart-open">
      <span class="count" id="cart-count"></span>
      <span><span id="cart-label">View order</span> · <span id="cart-total"></span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-name">
    <div class="viewer-card">
      <button class="viewer-close" type="button" id="viewer-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="slides" id="viewer-slides"></div>
      <div class="dots" id="viewer-dots"></div>
      <h2 id="viewer-name"></h2>
      <div class="v-price" id="viewer-price"></div>
      <p class="v-desc" id="viewer-desc"></p>
      <div id="viewer-action"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const slug = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
    const CART_KEY = 'op_cart_' + slug;
    const state = { store: null, products: [], cart: new Map(), viewing: null };
    const THEME_HEX = { green: '#12B76A', coral: '#FF8A7A', sun: '#FFD23F', sky: '#6CCFF6', grape: '#6A4CE0', night: '#1B1530' };
    const TINTS = ['t0', 't1', 't2', 't3', 't4'];
    const tintFor = (text) => TINTS[[...String(text || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % TINTS.length];
    const initials = (name) => (String(name || '').replace(/['’]/g, '').match(/[A-Za-z0-9]+/g) || ['?']).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    // ---------- helpers ----------
    function formatNaira(kobo) {
      const decimals = kobo % 100 === 0 ? 0 : 2;
      return '₦' + (kobo / 100).toLocaleString('en-NG', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function switchView(name) {
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
      document.querySelectorAll('.error').forEach((e) => { e.textContent = ''; e.classList.remove('show'); });
      document.querySelectorAll('.invalid').forEach((i) => i.classList.remove('invalid'));
      renderCartBar(name);
      window.scrollTo(0, 0);
    }
    function showError(message, field) {
      const box = $('checkout-error');
      box.textContent = message;
      box.classList.add('show');
      const input = field && $('checkout-' + field);
      if (input) { input.classList.add('invalid'); input.focus(); }
    }
    async function api(path, body) {
      try {
        const res = await fetch(path, body
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
          : { cache: 'no-store' });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        return { ok: false, status: 0, data: { error: "Can't connect. Check your internet and try again." } };
      }
    }
    function waLink(phone, text) { return 'https://wa.me/' + phone + (text ? '?text=' + encodeURIComponent(text) : ''); }

    // A photo, or a coloured tile with the product's first letter.
    function photoTile(p, className, index) {
      const box = el('div', className + ' ph ' + tintFor(p.name));
      const url = (p.photos || [])[index || 0];
      if (url) {
        const img = document.createElement('img');
        img.alt = p.name;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = url;
        OP.fadeImage(img);
        box.appendChild(img);
      } else {
        box.appendChild(document.createTextNode(initials(p.name).slice(0, 1)));
      }
      return box;
    }

    // ---------- saved cart + customer details ----------
    function saveCart() {
      try { localStorage.setItem(CART_KEY, JSON.stringify([...state.cart])); } catch (e) {}
    }
    function loadCart() {
      try {
        const saved = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        const live = new Set(state.products.map((p) => p.id));
        state.cart = new Map(saved.filter(([id, qty]) => live.has(id) && qty > 0));
      } catch (e) { state.cart = new Map(); }
    }
    function saveCustomer(c) { try { localStorage.setItem('op_customer', JSON.stringify(c)); } catch (e) {} }
    function savedCustomer() { try { return JSON.parse(localStorage.getItem('op_customer') || '{}'); } catch (e) { return {}; } }

    function setQty(id, qty) {
      const before = state.cart.get(id) || 0;
      if (qty <= 0) state.cart.delete(id);
      else state.cart.set(id, Math.min(99, qty));
      saveCart();
      renderProducts();
      if ($('view-checkout').classList.contains('active')) renderCheckout();
      renderCartBar();
      if (state.viewing === id) renderViewerAction();
      if (qty > before) { OP.replay($('cart-count'), 'bump'); OP.buzz(8); }
    }
    function onlineOrdering() { return !state.store || state.store.acceptingOrders !== false; }
    function canOrder() { return onlineOrdering() || !!(state.store && state.store.whatsappPhone); }

    // WhatsApp-only mode: the cart becomes a message, nothing is saved here.
    function cartMessage() {
      const t = cartTotals();
      const lines = [];
      state.cart.forEach((qty, id) => {
        const p = state.products.find((x) => x.id === id);
        if (p) lines.push(qty + ' × ' + p.name + ' — ' + formatNaira(p.priceKobo * qty));
      });
      return ['Hi ' + state.store.businessName + ', I\'d like to order:', '', ...lines,
        t.delivery ? 'Delivery: ' + formatNaira(t.delivery) : null,
        'Total: ' + formatNaira(t.total)].filter((x) => x !== null).join('\n');
    }

    function cartTotals() {
      let count = 0, subtotal = 0;
      state.cart.forEach((qty, id) => {
        const p = state.products.find((x) => x.id === id);
        if (p) { count += qty; subtotal += p.priceKobo * qty; }
      });
      const delivery = state.store ? state.store.deliveryFeeKobo : 0;
      return { count, subtotal, delivery, total: subtotal + delivery };
    }

    function stepper(id, qty) {
      const box = el('div', 'stepper');
      const minus = el('button', null, '−');
      minus.type = 'button';
      minus.setAttribute('aria-label', 'One less');
      minus.addEventListener('click', () => setQty(id, qty - 1));
      const plus = el('button', null, '+');
      plus.type = 'button';
      plus.setAttribute('aria-label', 'One more');
      plus.addEventListener('click', () => setQty(id, qty + 1));
      box.append(minus, el('span', null, String(qty)), plus);
      return box;
    }

    function addButton(p) {
      const add = el('button', 'add');
      add.type = 'button';
      add.innerHTML = PLUS;
      add.setAttribute('aria-label', 'Add ' + p.name);
      add.addEventListener('click', () => setQty(p.id, 1));
      return add;
    }

    // ---------- shop ----------
    function applyTheme(theme) {
      const id = THEME_HEX[theme] ? theme : 'green';
      document.documentElement.setAttribute('data-store', id);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', THEME_HEX[id]);
    }

    function renderStore() {
      const s = state.store;
      document.title = s.businessName + ' · Order online';
      applyTheme(s.theme);
      $('store-name').textContent = s.businessName;
      $('store-initials').textContent = initials(s.businessName);
      const delivery = [];
      if (s.deliveryFeeKobo) delivery.push('Delivery ' + formatNaira(s.deliveryFeeKobo));
      if (s.deliveryNote) delivery.push(s.deliveryNote);
      $('store-delivery').textContent = delivery.join(' · ') || 'Order online, pay by bank transfer';
      if (s.whatsappPhone) {
        $('store-chat').href = waLink(s.whatsappPhone, 'Hi ' + s.businessName + ', I have a question about your store.');
        $('store-chat').hidden = false;
      }
      $('branding').hidden = !s.branded;
      // Free plan over its monthly limit: orders go straight to WhatsApp.
      const mode = $('shop-mode');
      mode.hidden = s.acceptingOrders !== false;
      mode.textContent = s.whatsappPhone
        ? 'Orders here go straight to the seller on WhatsApp. Add what you want, then tap "Send on WhatsApp".'
        : "This store isn't taking orders online right now. Please contact the seller.";
      renderProducts(true);
    }

    function renderProducts(first) {
      const list = $('product-list');
      list.textContent = '';
      list.classList.toggle('stagger', !!first);
      $('products-title').textContent = state.products.length ? 'Products' : '';
      $('products-count').textContent = state.products.length > 1 ? state.products.length + ' items' : '';
      if (!state.products.length) {
        list.appendChild(el('div', 'empty', state.store.whatsappPhone
          ? 'No products listed yet. Tap "Chat with the seller" to ask what\'s available.'
          : 'No products listed yet. Check back soon.'));
        return;
      }
      state.products.forEach((p) => {
        const card = el('div', 'product');
        const photo = el('button', 'p-photo');
        photo.type = 'button';
        photo.setAttribute('aria-label', 'See ' + p.name);
        const tile = photoTile(p, 'p-tile');
        tile.style.cssText = 'position:absolute;inset:0';
        photo.appendChild(tile);
        if ((p.photos || []).length > 1) {
          const more = el('span', 'more');
          p.photos.forEach(() => more.appendChild(document.createElement('i')));
          photo.appendChild(more);
        }
        photo.addEventListener('click', () => openViewer(p.id));
        card.appendChild(photo);
        const body = el('div', 'p-body');
        body.appendChild(el('div', 'p-name', p.name));
        if (p.description) body.appendChild(el('div', 'p-desc', p.description));
        const foot = el('div', 'p-foot');
        foot.appendChild(el('div', 'p-price', formatNaira(p.priceKobo)));
        const qty = state.cart.get(p.id) || 0;
        if (canOrder()) foot.appendChild(qty ? stepper(p.id, qty) : addButton(p));
        body.appendChild(foot);
        card.appendChild(body);
        list.appendChild(card);
      });
    }

    function renderCartBar(viewName) {
      const view = viewName || (document.querySelector('.view.active') || {}).id;
      const onShop = view === 'shop' || view === 'view-shop';
      const t = cartTotals();
      $('cartbar').hidden = !(onShop && t.count > 0);
      $('cart-count').textContent = t.count + (t.count === 1 ? ' item' : ' items');
      $('cartbar').classList.toggle('wa', !onlineOrdering());
      $('cart-label').textContent = onlineOrdering() ? 'View order' : 'Send on WhatsApp';
      $('cart-total').textContent = formatNaira(t.total);
    }

    // ---------- photo viewer ----------
    function openViewer(id) {
      const p = state.products.find((x) => x.id === id);
      if (!p) return;
      state.viewing = id;
      const slides = $('viewer-slides');
      slides.textContent = '';
      const count = Math.max(1, (p.photos || []).length);
      for (let i = 0; i < count; i++) slides.appendChild(photoTile(p, 'slide', i));
      const dots = $('viewer-dots');
      dots.textContent = '';
      if (count > 1) for (let i = 0; i < count; i++) dots.appendChild(el('i', i ? '' : 'on'));
      slides.scrollLeft = 0;
      $('viewer-name').textContent = p.name;
      $('viewer-price').textContent = formatNaira(p.priceKobo);
      $('viewer-desc').textContent = p.description || '';
      renderViewerAction();
      $('viewer').hidden = false;
      document.body.style.overflow = 'hidden';
      $('viewer-close').focus();
    }
    function renderViewerAction() {
      const p = state.products.find((x) => x.id === state.viewing);
      const box = $('viewer-action');
      box.textContent = '';
      if (!p || !canOrder()) return;
      const qty = state.cart.get(p.id) || 0;
      if (qty) {
        const row = el('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px';
        row.append(el('b', null, qty + ' in your order'), stepper(p.id, qty));
        box.appendChild(row);
      } else {
        const add = el('button', 'btn theme', 'Add to order');
        add.type = 'button';
        add.addEventListener('click', () => setQty(p.id, 1));
        box.appendChild(add);
      }
    }
    function closeViewer() {
      $('viewer').hidden = true;
      state.viewing = null;
      document.body.style.overflow = '';
    }
    $('viewer-close').addEventListener('click', closeViewer);
    $('viewer').addEventListener('click', (e) => { if (e.target === $('viewer')) closeViewer(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });
    $('viewer-slides').addEventListener('scroll', () => {
      const s = $('viewer-slides');
      const i = Math.round(s.scrollLeft / Math.max(1, s.clientWidth));
      $('viewer-dots').querySelectorAll('i').forEach((d, n) => d.classList.toggle('on', n === i));
    }, { passive: true });

    // ---------- checkout ----------
    function renderCheckout() {
      const box = $('checkout-lines');
      box.textContent = '';
      state.cart.forEach((qty, id) => {
        const p = state.products.find((x) => x.id === id);
        if (!p) return;
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-name', p.name));
        main.appendChild(el('div', 'l-sub', formatNaira(p.priceKobo) + ' each · ' + formatNaira(p.priceKobo * qty)));
        line.append(photoTile(p, 'thumb'), main, stepper(id, qty));
        box.appendChild(line);
      });
      const t = cartTotals();
      $('sum-subtotal').textContent = formatNaira(t.subtotal);
      $('sum-delivery').textContent = formatNaira(t.delivery);
      $('sum-delivery-row').hidden = !t.delivery;
      $('sum-total').textContent = formatNaira(t.total);
      if (!t.count) switchView('shop');
    }

    $('cart-open').addEventListener('click', () => {
      if (!onlineOrdering()) {
        window.open('https://wa.me/' + state.store.whatsappPhone + '?text=' + encodeURIComponent(cartMessage()), '_blank', 'noopener');
        return;
      }
      const c = savedCustomer();
      if (!$('checkout-name').value) $('checkout-name').value = c.name || '';
      if (!$('checkout-phone').value) $('checkout-phone').value = c.phone || '';
      if (!$('checkout-address').value) $('checkout-address').value = c.address || '';
      renderCheckout();
      switchView('checkout');
    });

    document.querySelectorAll('[data-go="shop"]').forEach((b) => b.addEventListener('click', () => {
      renderProducts();
      switchView('shop');
    }));

    document.addEventListener('input', (e) => {
      e.target.classList.remove('invalid');
      const err = $('checkout-error');
      if (err.classList.contains('show')) { err.classList.remove('show'); err.textContent = ''; }
    });

    $('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const customer = {
        name: $('checkout-name').value.trim(),
        phone: $('checkout-phone').value.trim(),
        address: $('checkout-address').value.trim()
      };
      const note = $('checkout-note').value.trim();
      if (customer.name.length < 2) return showError('Enter your name.', 'name');
      if (customer.phone.replace(/\D/g, '').length < 10) return showError('Enter your phone number, like 0803 123 4567.', 'phone');
      if (!customer.address) return showError('Enter your delivery address, or "Pick up" if you\'ll collect it.', 'address');

      const items = [...state.cart].map(([productId, quantity]) => ({ productId, quantity }));
      const btn = $('checkout-submit');
      btn.disabled = true;
      btn.textContent = 'Placing order…';
      const { ok, status, data } = await api('/api/public', { action: 'order', store: slug, items, customer, note });
      btn.disabled = false;
      btn.textContent = 'Place order';

      if (!ok) {
        if (status === 403 && data.capReached) {
          state.store.acceptingOrders = false;
          renderStore();
          return switchView('shop');
        }
        if (status === 409 && Array.isArray(data.unavailable)) {
          data.unavailable.forEach((id) => state.cart.delete(id));
          saveCart();
          await loadStore(true);
          if (cartTotals().count === 0) {
            // Everything in the order sold out: back to the products, with a note.
            switchView('shop');
            $('shop-error').textContent = 'Sorry, what you picked is no longer available. Have a look at what else is in stock.';
            return $('shop-error').classList.add('show');
          }
          renderCheckout();
        }
        return showError(data.error || 'Could not place your order. Please try again.', data.field);
      }

      saveCustomer(customer);
      state.cart.clear();
      saveCart();
      $('checkout-note').value = '';
      renderDone(data.order, data.store);
    });

    // ---------- order placed ----------
    function orderMessage(order, store, invoiceUrl) {
      const lines = order.items.map((i) => i.quantity + ' × ' + i.name + ' — ' + formatNaira(i.lineTotalKobo));
      const parts = [
        'Hi ' + store.businessName + ', I just placed order #' + order.number + '.',
        '',
        ...lines,
        order.deliveryFeeKobo ? 'Delivery: ' + formatNaira(order.deliveryFeeKobo) : null,
        'Total: ' + formatNaira(order.totalKobo),
        '',
        'Name: ' + order.customer.name,
        order.customer.address ? 'Address: ' + order.customer.address : null,
        order.note ? 'Note: ' + order.note : null,
        '',
        'Invoice: ' + invoiceUrl
      ];
      return parts.filter((p) => p !== null).join('\n');
    }

    function renderDone(order, store) {
      const invoiceUrl = location.origin + '/i/' + order.publicId;
      $('done-title').textContent = 'Order #' + order.number + ' placed';
      $('done-text').textContent = store.whatsappPhone
        ? 'Send it to ' + store.businessName + ' on WhatsApp so they can confirm it and arrange delivery.'
        : store.businessName + ' has your order and will call or message you to confirm it.';
      const wa = $('done-whatsapp');
      if (store.whatsappPhone) {
        wa.href = waLink(store.whatsappPhone, orderMessage(order, store, invoiceUrl));
        wa.hidden = false;
      } else {
        wa.hidden = true;
      }

      // How to pay
      const pay = $('done-pay');
      pay.textContent = '';
      pay.appendChild(el('p', 'pay-label', 'Amount to pay'));
      pay.appendChild(el('div', 'pay-amount', formatNaira(order.totalKobo)));
      if (store.bank) {
        const rows = [['Bank', store.bank.name], ['Account number', store.bank.accountNumber], ['Account name', store.bank.accountName]];
        rows.forEach(([label, value]) => {
          const row = el('div', 'pay-row');
          row.appendChild(el('span', 'muted', label));
          const right = el('span');
          right.appendChild(el('b', null, value));
          if (label === 'Account number') {
            const copy = el('button', 'copy', 'Copy');
            copy.type = 'button';
            copy.addEventListener('click', async () => {
              try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; }
              catch (e) { copy.textContent = 'Hold to copy'; }
              setTimeout(() => { copy.textContent = 'Copy'; }, 2000);
            });
            right.appendChild(copy);
          }
          row.appendChild(right);
          pay.appendChild(row);
        });
      } else {
        pay.appendChild(el('p', 'muted', store.businessName + ' will send you their payment details.'));
      }

      // Order summary
      const lines = $('done-lines');
      lines.textContent = '';
      order.items.forEach((i) => {
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-name', i.quantity + ' × ' + i.name));
        line.append(main, el('span', 'num', formatNaira(i.lineTotalKobo)));
        lines.appendChild(line);
      });
      if (order.deliveryFeeKobo) {
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-sub', 'Delivery'));
        line.append(main, el('span', 'num', formatNaira(order.deliveryFeeKobo)));
        lines.appendChild(line);
      }
      $('done-invoice').href = invoiceUrl;
      switchView('done');
      setTimeout(() => OP.confetti(document.querySelector('.done-icon'), 110), 150);
    }

    // ---------- start ----------
    async function loadStore(quiet) {
      const { ok, status, data } = await api('/api/public?store=' + encodeURIComponent(slug));
      if (!ok) {
        if (quiet) return;
        $('missing-text').textContent = status === 404
          ? (data.error || 'Check the link with the seller.')
          : "We couldn't load this store. Check your internet and try again.";
        if (status !== 404) $('view-missing').querySelector('h1').textContent = 'Something went wrong';
        return switchView('missing');
      }
      state.store = data.store;
      state.products = data.products;
      loadCart();
      saveCart();
      renderStore();
      if (!quiet) switchView('shop');
    }

    if (!slug) switchView('missing');
    else loadStore(false);
  </script>
</body>
</html>
