<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order online</title>
  <meta name="description" content="Order online and pay by bank transfer.">
  <style>
    :root {
      --bg:#f6f6f3; --card:#ffffff; --ink:#141414; --muted:#6b6b66; --line:#e4e4de;
      --accent:#0a7d4f; --accent-ink:#ffffff; --accent-soft:#e7f4ee; --bad:#b42318; --bad-soft:#fdecea;
      --wa:#1fa855;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#101010; --card:#1a1a1a; --ink:#f2f2ef; --muted:#a3a39d; --line:#2a2a28;
        --accent:#2fbf7f; --accent-ink:#0b1f15; --accent-soft:#14291f; --bad:#ff7a6b; --bad-soft:#2c1714;
        --wa:#2fbf6a;
      }
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height:1.5; -webkit-text-size-adjust:100%; }
    main { max-width:480px; margin:0 auto; padding:24px 16px calc(120px + env(safe-area-inset-bottom)); }
    h1 { font-size:26px; line-height:1.2; letter-spacing:-0.02em; margin:0; }
    .muted { color:var(--muted); }
    .view { display:none; }
    .view.active { display:block; }
    .loading { padding:80px 0; text-align:center; color:var(--muted); }

    /* store header */
    .store-head { display:flex; align-items:center; gap:14px; margin:8px 0 6px; }
    .avatar { flex:none; width:56px; height:56px; border-radius:16px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; letter-spacing:-0.02em; }
    .store-head p { margin:2px 0 0; font-size:14px; }
    .chat { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; }
    .chat svg { width:16px; height:16px; color:var(--wa); }
    .section-title { font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin:28px 0 10px; }

    /* products */
    .product { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 14px 14px 16px; margin-bottom:10px; }
    .p-main { flex:1; min-width:0; }
    .p-name { font-weight:600; }
    .p-desc { font-size:14px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .p-price { margin-top:4px; font-weight:700; font-variant-numeric:tabular-nums; }
    .add { flex:none; border:1px solid var(--accent); background:none; color:var(--accent); font:inherit; font-weight:600; font-size:15px; padding:8px 18px; border-radius:12px; cursor:pointer; }
    .stepper { flex:none; display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .stepper button { width:38px; height:38px; border:0; background:var(--accent-soft); color:var(--accent); font:inherit; font-size:20px; font-weight:600; cursor:pointer; }
    .stepper span { min-width:32px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
    .empty { text-align:center; padding:36px 16px; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:16px; }

    /* cart bar */
    .cartbar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:10; }
    .cartbar button { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; max-width:448px; margin:0 auto; padding:15px 18px; border:0; border-radius:16px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.15); }
    .cartbar .count { background:rgba(255,255,255,0.2); border-radius:999px; padding:2px 10px; font-size:14px; }

    /* checkout */
    .back { background:none; border:0; padding:4px 0; margin:0 0 14px; font:inherit; color:var(--accent); font-weight:600; cursor:pointer; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 16px; margin-top:16px; }
    .line { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
    .line:first-child { border-top:0; }
    .line .l-main { flex:1; min-width:0; }
    .line .l-name { font-weight:600; }
    .line .l-sub { font-size:14px; color:var(--muted); }
    .line .stepper button { width:34px; height:34px; font-size:18px; }
    .sum { display:flex; justify-content:space-between; padding:8px 0; font-variant-numeric:tabular-nums; }
    .sum.total { border-top:1px solid var(--line); margin-top:4px; padding-top:12px; font-weight:700; font-size:18px; }
    label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
    input, textarea { width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; outline:none; -webkit-appearance:none; }
    textarea { min-height:76px; resize:vertical; }
    input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .invalid { border-color:var(--bad) !important; }
    .error { display:none; margin:16px 0 0; padding:12px 14px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:14px; }
    .error.show { display:block; }
    .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:20px; padding:15px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:16px; font-weight:600; text-decoration:none; cursor:pointer; }
    .btn[disabled] { opacity:0.6; }
    .btn.wa { background:var(--wa); color:#fff; }
    .btn.wa svg { width:20px; height:20px; }
    .btn.secondary { background:var(--card); color:var(--ink); border:1px solid var(--line); }
    .fine { font-size:13px; color:var(--muted); text-align:center; margin:14px 0 0; }

    /* done */
    .done-head { text-align:center; margin:16px 0 4px; }
    .done-icon { width:64px; height:64px; margin:0 auto 14px; border-radius:32px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
    .done-icon svg { width:32px; height:32px; }
    .done-head p { color:var(--muted); margin:8px 0 0; }
    .pay { padding:14px 16px; }
    .pay-label { font-size:13px; color:var(--muted); margin:0; }
    .pay-amount { font-size:28px; font-weight:700; letter-spacing:-0.02em; margin:2px 0 10px; font-variant-numeric:tabular-nums; }
    .pay-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
    .pay-row b { font-variant-numeric:tabular-nums; }
    .copy { border:1px solid var(--line); background:none; color:var(--accent); font:inherit; font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; cursor:pointer; margin-left:8px; }
    .links { text-align:center; margin-top:18px; }
    .links a, .links button { color:var(--accent); font-weight:600; text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:6px; }

    footer { margin-top:40px; text-align:center; font-size:13px; color:var(--muted); }
    footer a { color:var(--ink); font-weight:700; text-decoration:none; }
    footer a span { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <section class="view active" id="view-loading"><p class="loading">Loading store…</p></section>

    <section class="view" id="view-missing">
      <div class="done-head" style="margin-top:60px">
        <h1>Store not found</h1>
        <p id="missing-text">Check the link with the seller.</p>
      </div>
    </section>

    <!-- Products -->
    <section class="view" id="view-shop">
      <div class="store-head">
        <div class="avatar" id="store-initials"></div>
        <div>
          <h1 id="store-name"></h1>
          <p class="muted" id="store-delivery"></p>
        </div>
      </div>
      <a class="chat" id="store-chat" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
        Chat with the seller
      </a>
      <p class="error" id="shop-error"></p>
      <p class="section-title" id="products-title">Products</p>
      <div id="product-list"></div>
    </section>

    <!-- Checkout -->
    <section class="view" id="view-checkout">
      <button class="back" type="button" data-go="shop">‹ Keep shopping</button>
      <h1>Your order</h1>
      <div class="card" id="checkout-lines"></div>
      <div class="card">
        <div class="sum"><span>Subtotal</span><span id="sum-subtotal"></span></div>
        <div class="sum" id="sum-delivery-row"><span>Delivery</span><span id="sum-delivery"></span></div>
        <div class="sum total"><span>Total</span><span id="sum-total"></span></div>
      </div>
      <form id="checkout-form" novalidate>
        <label for="checkout-name">Your name</label>
        <input id="checkout-name" type="text" autocomplete="name" maxlength="80">
        <label for="checkout-phone">Phone number</label>
        <input id="checkout-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0803 123 4567">
        <label for="checkout-address">Delivery address</label>
        <textarea id="checkout-address" autocomplete="street-address" maxlength="300" placeholder="House number, street, area, city"></textarea>
        <label for="checkout-note">Note for the seller <span class="muted">(optional)</span></label>
        <input id="checkout-note" type="text" maxlength="300" placeholder="e.g. Colour, size, best time to deliver">
        <p class="error" id="checkout-error"></p>
        <button class="btn" type="submit" id="checkout-submit">Place order</button>
      </form>
      <p class="fine">You'll pay the seller by bank transfer. They'll confirm your order on WhatsApp.</p>
    </section>

    <!-- Order placed -->
    <section class="view" id="view-done">
      <div class="done-head">
        <div class="done-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h1 id="done-title">Order placed</h1>
        <p id="done-text"></p>
      </div>
      <a class="btn wa" id="done-whatsapp" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
        Send order on WhatsApp
      </a>
      <div class="card pay" id="done-pay"></div>
      <div class="card" id="done-lines"></div>
      <div class="links">
        <a id="done-invoice" href="#">View invoice</a>
        <button type="button" data-go="shop">Order something else</button>
      </div>
    </section>

    <footer id="branding" hidden>Made with <a href="/">Order<span>Padi</span></a></footer>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <button type="button" id="cart-open">
      <span><span class="count" id="cart-count"></span></span>
      <span>View order · <span id="cart-total"></span></span>
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const slug = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
    const CART_KEY = 'op_cart_' + slug;
    const state = { store: null, products: [], cart: new Map() };

    // ---------- helpers ----------
    function formatNaira(kobo) {
      const decimals = kobo % 100 === 0 ? 0 : 2;
      return '₦' + (kobo / 100).toLocaleString('en-NG', { minimumFractionDigits: decimals, maximumFractionDigits: 2 });
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function switchView(name) {
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
      document.querySelectorAll('.error').forEach((e) => { e.textContent = ''; e.classList.remove('show'); });
      document.querySelectorAll('.invalid').forEach((i) => i.classList.remove('invalid'));
      renderCartBar(name);
      window.scrollTo(0, 0);
    }
    function showError(message, field) {
      const box = $('checkout-error');
      box.textContent = message;
      box.classList.add('show');
      const input = field && $('checkout-' + field);
      if (input) { input.classList.add('invalid'); input.focus(); }
    }
    async function api(path, body) {
      try {
        const res = await fetch(path, body
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
          : { cache: 'no-store' });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        return { ok: false, status: 0, data: { error: "Can't connect. Check your internet and try again." } };
      }
    }
    function waLink(phone, text) { return 'https://wa.me/' + phone + (text ? '?text=' + encodeURIComponent(text) : ''); }

    // ---------- saved cart + customer details ----------
    function saveCart() {
      try { localStorage.setItem(CART_KEY, JSON.stringify([...state.cart])); } catch (e) {}
    }
    function loadCart() {
      try {
        const saved = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        const live = new Set(state.products.map((p) => p.id));
        state.cart = new Map(saved.filter(([id, qty]) => live.has(id) && qty > 0));
      } catch (e) { state.cart = new Map(); }
    }
    function saveCustomer(c) { try { localStorage.setItem('op_customer', JSON.stringify(c)); } catch (e) {} }
    function savedCustomer() { try { return JSON.parse(localStorage.getItem('op_customer') || '{}'); } catch (e) { return {}; } }

    function setQty(id, qty) {
      if (qty <= 0) state.cart.delete(id);
      else state.cart.set(id, Math.min(99, qty));
      saveCart();
      renderProducts();
      if ($('view-checkout').classList.contains('active')) renderCheckout();
      renderCartBar();
    }
    function cartTotals() {
      let count = 0, subtotal = 0;
      state.cart.forEach((qty, id) => {
        const p = state.products.find((x) => x.id === id);
        if (p) { count += qty; subtotal += p.priceKobo * qty; }
      });
      const delivery = state.store ? state.store.deliveryFeeKobo : 0;
      return { count, subtotal, delivery, total: subtotal + delivery };
    }

    function stepper(id, qty) {
      const box = el('div', 'stepper');
      const minus = el('button', null, '−');
      minus.type = 'button';
      minus.setAttribute('aria-label', 'One less');
      minus.addEventListener('click', () => setQty(id, qty - 1));
      const plus = el('button', null, '+');
      plus.type = 'button';
      plus.setAttribute('aria-label', 'One more');
      plus.addEventListener('click', () => setQty(id, qty + 1));
      box.append(minus, el('span', null, String(qty)), plus);
      return box;
    }

    // ---------- shop ----------
    function renderStore() {
      const s = state.store;
      document.title = s.businessName + ' · Order online';
      $('store-name').textContent = s.businessName;
      $('store-initials').textContent = s.businessName.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      const delivery = [];
      if (s.deliveryFeeKobo) delivery.push('Delivery ' + formatNaira(s.deliveryFeeKobo));
      if (s.deliveryNote) delivery.push(s.deliveryNote);
      $('store-delivery').textContent = delivery.join(' · ') || 'Order online, pay by bank transfer';
      if (s.whatsappPhone) {
        $('store-chat').href = waLink(s.whatsappPhone, 'Hi ' + s.businessName + ', I have a question about your store.');
        $('store-chat').hidden = false;
      }
      $('branding').hidden = !s.branded;
      renderProducts();
    }

    function renderProducts() {
      const list = $('product-list');
      list.textContent = '';
      $('products-title').textContent = state.products.length ? 'Products' : '';
      if (!state.products.length) {
        list.appendChild(el('div', 'empty', state.store.whatsappPhone
          ? 'No products listed yet. Tap "Chat with the seller" to ask what\'s available.'
          : 'No products listed yet. Check back soon.'));
        return;
      }
      state.products.forEach((p) => {
        const card = el('div', 'product');
        const main = el('div', 'p-main');
        main.appendChild(el('div', 'p-name', p.name));
        if (p.description) main.appendChild(el('div', 'p-desc', p.description));
        main.appendChild(el('div', 'p-price', formatNaira(p.priceKobo)));
        card.appendChild(main);
        const qty = state.cart.get(p.id) || 0;
        if (qty) card.appendChild(stepper(p.id, qty));
        else {
          const add = el('button', 'add', 'Add');
          add.type = 'button';
          add.setAttribute('aria-label', 'Add ' + p.name);
          add.addEventListener('click', () => setQty(p.id, 1));
          card.appendChild(add);
        }
        list.appendChild(card);
      });
    }

    function renderCartBar(viewName) {
      const view = viewName || (document.querySelector('.view.active') || {}).id;
      const onShop = view === 'shop' || view === 'view-shop';
      const t = cartTotals();
      $('cartbar').hidden = !(onShop && t.count > 0);
      $('cart-count').textContent = t.count + (t.count === 1 ? ' item' : ' items');
      $('cart-total').textContent = formatNaira(t.total);
    }

    // ---------- checkout ----------
    function renderCheckout() {
      const box = $('checkout-lines');
      box.textContent = '';
      state.cart.forEach((qty, id) => {
        const p = state.products.find((x) => x.id === id);
        if (!p) return;
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-name', p.name));
        main.appendChild(el('div', 'l-sub', formatNaira(p.priceKobo) + ' each · ' + formatNaira(p.priceKobo * qty)));
        line.append(main, stepper(id, qty));
        box.appendChild(line);
      });
      const t = cartTotals();
      $('sum-subtotal').textContent = formatNaira(t.subtotal);
      $('sum-delivery').textContent = formatNaira(t.delivery);
      $('sum-delivery-row').hidden = !t.delivery;
      $('sum-total').textContent = formatNaira(t.total);
      if (!t.count) switchView('shop');
    }

    $('cart-open').addEventListener('click', () => {
      const c = savedCustomer();
      if (!$('checkout-name').value) $('checkout-name').value = c.name || '';
      if (!$('checkout-phone').value) $('checkout-phone').value = c.phone || '';
      if (!$('checkout-address').value) $('checkout-address').value = c.address || '';
      renderCheckout();
      switchView('checkout');
    });

    document.querySelectorAll('[data-go="shop"]').forEach((b) => b.addEventListener('click', () => {
      renderProducts();
      switchView('shop');
    }));

    document.addEventListener('input', (e) => {
      e.target.classList.remove('invalid');
      const err = $('checkout-error');
      if (err.classList.contains('show')) { err.classList.remove('show'); err.textContent = ''; }
    });

    $('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const customer = {
        name: $('checkout-name').value.trim(),
        phone: $('checkout-phone').value.trim(),
        address: $('checkout-address').value.trim()
      };
      const note = $('checkout-note').value.trim();
      if (customer.name.length < 2) return showError('Enter your name.', 'name');
      if (customer.phone.replace(/\D/g, '').length < 10) return showError('Enter your phone number, like 0803 123 4567.', 'phone');
      if (!customer.address) return showError('Enter your delivery address, or "Pick up" if you\'ll collect it.', 'address');

      const items = [...state.cart].map(([productId, quantity]) => ({ productId, quantity }));
      const btn = $('checkout-submit');
      btn.disabled = true;
      btn.textContent = 'Placing order…';
      const { ok, status, data } = await api('/api/public', { action: 'order', store: slug, items, customer, note });
      btn.disabled = false;
      btn.textContent = 'Place order';

      if (!ok) {
        if (status === 409 && Array.isArray(data.unavailable)) {
          data.unavailable.forEach((id) => state.cart.delete(id));
          saveCart();
          await loadStore(true);
          if (cartTotals().count === 0) {
            // Everything in the order sold out: back to the products, with a note.
            switchView('shop');
            $('shop-error').textContent = 'Sorry, what you picked is no longer available. Have a look at what else is in stock.';
            return $('shop-error').classList.add('show');
          }
          renderCheckout();
        }
        return showError(data.error || 'Could not place your order. Please try again.', data.field);
      }

      saveCustomer(customer);
      state.cart.clear();
      saveCart();
      $('checkout-note').value = '';
      renderDone(data.order, data.store);
    });

    // ---------- order placed ----------
    function orderMessage(order, store, invoiceUrl) {
      const lines = order.items.map((i) => i.quantity + ' × ' + i.name + ' — ' + formatNaira(i.lineTotalKobo));
      const parts = [
        'Hi ' + store.businessName + ', I just placed order #' + order.number + '.',
        '',
        ...lines,
        order.deliveryFeeKobo ? 'Delivery: ' + formatNaira(order.deliveryFeeKobo) : null,
        'Total: ' + formatNaira(order.totalKobo),
        '',
        'Name: ' + order.customer.name,
        order.customer.address ? 'Address: ' + order.customer.address : null,
        order.note ? 'Note: ' + order.note : null,
        '',
        'Invoice: ' + invoiceUrl
      ];
      return parts.filter((p) => p !== null).join('\n');
    }

    function renderDone(order, store) {
      const invoiceUrl = location.origin + '/i/' + order.publicId;
      $('done-title').textContent = 'Order #' + order.number + ' placed';
      $('done-text').textContent = store.whatsappPhone
        ? 'Send it to ' + store.businessName + ' on WhatsApp so they can confirm it and arrange delivery.'
        : store.businessName + ' has your order and will call or message you to confirm it.';
      const wa = $('done-whatsapp');
      if (store.whatsappPhone) {
        wa.href = waLink(store.whatsappPhone, orderMessage(order, store, invoiceUrl));
        wa.hidden = false;
      } else {
        wa.hidden = true;
      }

      // How to pay
      const pay = $('done-pay');
      pay.textContent = '';
      pay.appendChild(el('p', 'pay-label', 'Amount to pay'));
      pay.appendChild(el('div', 'pay-amount', formatNaira(order.totalKobo)));
      if (store.bank) {
        const rows = [['Bank', store.bank.name], ['Account number', store.bank.accountNumber], ['Account name', store.bank.accountName]];
        rows.forEach(([label, value]) => {
          const row = el('div', 'pay-row');
          row.appendChild(el('span', 'muted', label));
          const right = el('span');
          right.appendChild(el('b', null, value));
          if (label === 'Account number') {
            const copy = el('button', 'copy', 'Copy');
            copy.type = 'button';
            copy.addEventListener('click', async () => {
              try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; }
              catch (e) { copy.textContent = 'Hold to copy'; }
              setTimeout(() => { copy.textContent = 'Copy'; }, 2000);
            });
            right.appendChild(copy);
          }
          row.appendChild(right);
          pay.appendChild(row);
        });
      } else {
        pay.appendChild(el('p', 'muted', store.businessName + ' will send you their payment details.'));
      }

      // Order summary
      const lines = $('done-lines');
      lines.textContent = '';
      order.items.forEach((i) => {
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-name', i.quantity + ' × ' + i.name));
        line.append(main, el('span', null, formatNaira(i.lineTotalKobo)));
        lines.appendChild(line);
      });
      if (order.deliveryFeeKobo) {
        const line = el('div', 'line');
        const main = el('div', 'l-main');
        main.appendChild(el('div', 'l-sub', 'Delivery'));
        line.append(main, el('span', null, formatNaira(order.deliveryFeeKobo)));
        lines.appendChild(line);
      }
      $('done-invoice').href = invoiceUrl;
      switchView('done');
    }

    // ---------- start ----------
    async function loadStore(quiet) {
      const { ok, status, data } = await api('/api/public?store=' + encodeURIComponent(slug));
      if (!ok) {
        if (quiet) return;
        $('missing-text').textContent = status === 404
          ? (data.error || 'Check the link with the seller.')
          : "We couldn't load this store. Check your internet and try again.";
        if (status !== 404) $('view-missing').querySelector('h1').textContent = 'Something went wrong';
        return switchView('missing');
      }
      state.store = data.store;
      state.products = data.products;
      loadCart();
      saveCart();
      renderStore();
      if (!quiet) switchView('shop');
    }

    if (!slug) switchView('missing');
    else loadStore(false);
  </script>
</body>
</html>
